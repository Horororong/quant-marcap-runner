name: Restore pinned KOSDAQ segment observations on repair branch
on:
  push:
    branches: [fix/kosdaq-global-observations]
    paths: ['.github/workflows/restore-kosdaq-global.yml']
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/fix/kosdaq-global-observations'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible repair dependencies
        run: pip install pandas==2.2.3 numpy==2.3.5 pyarrow==25.0.1 requests
      - name: Download inventoried original source
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          manifest=json.loads(Path('docs/audits/kosdaq-global-repair/source_inventory.json').read_text())
          source_dir=Path('/tmp/pinned-krx-source');source_dir.mkdir()
          for r in manifest['years']:
              expected=f"https://raw.githubusercontent.com/FinanceData/marcap/{manifest['upstream_commit']}/data/marcap-{r['year']}.parquet"
              assert r['url']==expected
              urllib.request.urlretrieve(expected,source_dir/f"marcap-{r['year']}.parquet")
          PY
      - name: Apply verified missing observations and export independent evidence
        run: |
          python scripts/repair_krx_market_segments.py --manifest docs/audits/kosdaq-global-repair/source_inventory.json --source-dir /tmp/pinned-krx-source --output docs/audits/kosdaq-global-repair/repair_report.json --apply
          python -c "import json; from pathlib import Path; r=json.loads(Path('docs/audits/kosdaq-global-repair/repair_report.json').read_text()); assert r['status']=='applied' and r['total_added_rows']==46753"
      - name: Commit only reviewed repair data to this feature branch
        env:
          REPAIR_BASE_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/kosdaq-global-observations | cut -f1)" = "$REPAIR_BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/krx_equities/yearly/marcap-2022.parquet data/krx_equities/yearly/marcap-2023.parquet data/krx_equities/yearly/marcap-2024.parquet data/krx_equities/yearly/marcap-2025.parquet data/krx_equities/yearly/marcap-2026.parquet docs/audits/kosdaq-global-repair/
          git commit -m "Restore 46,753 verified historical KOSDAQ segment observations"
          git push origin HEAD:refs/heads/fix/kosdaq-global-observations
