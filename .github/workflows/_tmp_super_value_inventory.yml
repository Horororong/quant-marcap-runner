name: Temp super value inventory

on:
  push:
    branches:
      - tmp/super-value-backtest-20260923
    paths:
      - '.github/workflows/_tmp_super_value_inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/super-value-backtest-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow
      - run: python scripts/_tmp_super_value_inventory.py
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/super_value_inventory.json
          git commit -m "Generate super value data inventory" || exit 0
          git push origin HEAD:tmp/super-value-backtest-20260923
