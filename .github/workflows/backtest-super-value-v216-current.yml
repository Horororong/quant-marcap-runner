name: Backtest Super Value v2-16 PIT Current

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_super_value_v216.py'

permissions:
  contents: write

concurrency:
  group: super-value-v216-current
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow plotly exchange_calendars

      - name: Syntax check
        run: python -m py_compile scripts/backtest_super_value_v216.py scripts/quant_backtest_template_PROJECT_v2-16_CURRENT.py

      - name: Run CURRENT v2-16 PIT super-value backtest
        run: python scripts/backtest_super_value_v216.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: super-value-v216-current-results
          path: results/super_value_v216/
          if-no-files-found: error

      - name: Commit reproducible results to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B analysis/super-value-v216-20260924
          git add scripts/backtest_super_value_v216.py results/super_value_v216/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Backtest super-value with CURRENT v2-16 and fast PIT data"
          fi
          git push --force origin HEAD:analysis/super-value-v216-20260924
