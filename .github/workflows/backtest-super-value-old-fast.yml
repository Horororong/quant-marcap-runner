name: Backtest original Kang super value old sample

on:
  push:
    branches: [chatgpt-super-value-backtest]
    paths:
      - 'scripts/run_super_value_old_fast.py'
      - '.github/workflows/backtest-super-value-old-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-super-value-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow
      - run: |
          cd scripts
          python run_super_value_old_fast.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/super_value_original/ || true
          if git diff --cached --quiet; then
            echo "No result files"
          else
            git commit -m "Add focused historical super-value results"
            git push origin HEAD:chatgpt-super-value-backtest
          fi
