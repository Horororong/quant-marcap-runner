name: Run marcap PIT analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy tabulate

      - name: Set analysis end date to 2026-08-18
        run: |
          sed -i "s/END = pd.Timestamp('2025-09-05')/END = pd.Timestamp('2026-08-18')/" analyze_marcap.py
          sed -i "s/YEARS = range(1998, 2026)/YEARS = range(1998, 2027)/" analyze_marcap.py
          grep -E "^(END|YEARS)" analyze_marcap.py

      - name: Run PIT analysis
        run: python analyze_marcap.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update marcap PIT analysis results through 2026-08-18"
            git push
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: marcap-pit-results
          path: results/
          if-no-files-found: error
