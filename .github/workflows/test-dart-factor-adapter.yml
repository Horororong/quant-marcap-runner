name: Test DART Factor Adapter v1

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dart-factor-adapter-v1
    paths:
      - 'scripts/dart_factor_adapter.py'
      - 'scripts/strategy_dsl.py'
      - 'scripts/strategy_dsl_runner.py'
      - 'scripts/test_super_value_dsl_regression.py'
      - 'config/strategies/super_value_original_dsl.json'
      - '.github/workflows/test-dart-factor-adapter.yml'

permissions:
  contents: read

concurrency:
  group: dart-factor-adapter-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow plotly exchange_calendars

      - name: Syntax check
        run: |
          python -m py_compile             scripts/dart_factor_adapter.py             scripts/strategy_dsl.py             scripts/strategy_dsl_runner.py             scripts/test_super_value_dsl_regression.py

      - name: Core DSL regression
        run: python scripts/test_strategy_dsl.py

      - name: Validate super-value DSL
        run: |
          python scripts/strategy_dsl_runner.py             config/strategies/super_value_original_dsl.json             --validate-only

      - name: Extract audited exact-account reference
        run: |
          git fetch origin research/super-value-audit-20260924:refs/remotes/origin/research/super-value-audit-20260924
          git show origin/research/super-value-audit-20260924:scripts/super_value_audited_nav.py > scripts/_audited_super_value_reference.py

      - name: Compare DART factors and Top20 with audited reference
        env:
          AUDITED_REFERENCE_SCRIPT: scripts/_audited_super_value_reference.py
        run: python scripts/test_super_value_dsl_regression.py
