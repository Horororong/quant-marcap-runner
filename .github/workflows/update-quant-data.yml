name: Update quant data

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_public_data.py'
      - 'update_dart_financials.py'
      - '.github/workflows/update-quant-data.yml'
  schedule:
    # 03:00 KST every day = 18:00 UTC previous day
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      DART_MAX_COMPANIES: ${{ vars.DART_MAX_COMPANIES || '300' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests finance-datareader pyarrow investiny

      - name: Update public market and macro data
        run: python update_public_data.py

      - name: Update DART financials
        run: python update_dart_financials.py

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update quant datasets"
            git push
          fi

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: quant-data-status
          path: data/status/
          if-no-files-found: warn
