name: Update quant data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_krx_equities_daily.py'
      - 'scripts/export_krx_symbol_csv.py'
      - 'update_public_data.py'
      - 'update_dart_financials.py'
      - '.github/workflows/update-quant-data.yml'
  schedule:
    # Scheduler wakes weekly, but the gate below runs the pipeline only every
    # other Wednesday at 07:30 KST (Tuesday 22:30 UTC).
    # Manual dispatch and relevant code changes always run immediately.
    - cron: '30 22 * * 2'

concurrency:
  group: update-quant-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_update: ${{ steps.biweekly.outputs.run_update }}
    steps:
      - name: Decide whether this scheduled week is active
        id: biweekly
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            echo "Manual/push event: run immediately"
            exit 0
          fi

          # Unix week slots never reset at year-end, avoiding ISO-week 52/53
          # edge cases. Odd slots are the active biweekly schedule.
          SLOT=$(( $(date -u +%s) / 604800 ))
          if [ $(( SLOT % 2 )) -eq 1 ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            echo "Active biweekly slot: $SLOT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "Inactive biweekly slot: $SLOT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      DART_MAX_COMPANIES: ${{ vars.DART_MAX_COMPANIES || '300' }}
      DART_WORKERS: ${{ vars.DART_WORKERS || '6' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests finance-datareader pyarrow

      # 1) Korean individual-stock PIT panel.
      # Missing 1995~prior-year files are backfilled once.
      # The current-year parquet is overwritten on each refresh.
      - name: Update KRX individual-stock panel
        run: python scripts/update_krx_equities_daily.py

      - name: Commit KRX individual-stock datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/krx_equities/ data/status/krx_equities_status.csv data/status/krx_equities_manifest.csv
          if git diff --cached --quiet; then
            echo "No KRX individual-stock data changes"
          else
            git commit -m "Update KRX individual-stock panel"
            git pull --rebase origin main
            git push
          fi

      # 2) Index, FX and macro series.
      - name: Update public market and macro data
        run: python update_public_data.py

      - name: Commit public datasets before DART
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices/ data/fx/ data/macro/ data/status/public_data_status.csv
          if git diff --cached --quiet; then
            echo "No public data changes"
          else
            git commit -m "Update public market and macro data"
            git pull --rebase origin main
            git push
          fi

      # 3) DART financial data.
      - name: Update DART financials
        run: python update_dart_financials.py

      - name: Commit DART datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials/ data/status/dart_status.csv data/status/dart_rotation_state.csv
          if git diff --cached --quiet; then
            echo "No DART data changes"
          else
            git commit -m "Update DART financials"
            git pull --rebase origin main
            git push
          fi

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-data-status
          path: data/status/
          if-no-files-found: warn
