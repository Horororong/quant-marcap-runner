name: All Weather Long Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_all_weather_long.py'
      - '.github/workflows/all-weather-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance xlrd requests
      - name: Refresh long proxy inputs
        run: python scripts/download_long_proxy_inputs.py
      - name: Run All Weather long-proxy backtest
        run: python scripts/backtest_all_weather_long.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/all_weather_long/ data/proxy_long/raw/
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Run All Weather long-proxy backtest'
            git push
          fi
