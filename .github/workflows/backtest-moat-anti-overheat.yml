name: Backtest Moat Anti Overheat

on:
  push:
    paths:
      - 'scripts/backtest_moat_anti_overheat.py'
      - '.github/workflows/backtest-moat-anti-overheat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Run backtest
        run: python scripts/backtest_moat_anti_overheat.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/moat_anti_overheat
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add moat anti-overheat backtest results'
            git push
          fi
