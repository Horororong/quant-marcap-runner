name: Backfill legacy DART 2000-2014 PIT history

on:
  workflow_dispatch:

concurrency:
  group: super-value-fast-pit-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      LEGACY_DART_START_YEAR: '2000'
      LEGACY_DART_END_YEAR: '2014'
      # Manual entry point shares the daily job's lock and bounded resume path.
      LEGACY_DART_INDEX_TASKS: '6'
      LEGACY_DART_MAX_DOCS: '2000'
      LEGACY_DART_WORKERS: '3'
      LEGACY_DART_MAX_REQUESTS: '2500'
      LEGACY_DART_MAX_SECONDS: '3300'
      LEGACY_DART_REQUEST_INTERVAL: '0.5'
      LEGACY_DART_CHECKPOINT_SIZE: '25'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow beautifulsoup4 lxml

      - name: Freeze source-audit plan and input checkpoint
        id: evidence
        env:
          LEGACY_DART_EVIDENCE_DIR: ${{ runner.temp }}/legacy-source-evidence
        run: python scripts/legacy_batch_evidence.py begin

      - name: Backfill legacy PIT financial statements
        env:
          LEGACY_DART_RUN_REPORT: ${{ runner.temp }}/legacy-collection-run.json
          LEGACY_DART_SOURCE_DIR: ${{ runner.temp }}/legacy-source-evidence/native
        timeout-minutes: 65
        run: python scripts/backfill_dart_legacy_2000_2014.py

      - name: Preserve source-audit output checkpoint
        if: always() && steps.evidence.outcome == 'success'
        env:
          LEGACY_DART_EVIDENCE_DIR: ${{ runner.temp }}/legacy-source-evidence
        run: python scripts/legacy_batch_evidence.py end

      - name: Commit legacy normalized data and status
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials/legacy_2000_2014/ || true
          git add data/status/dart_legacy_index_state.csv || true
          git add data/status/dart_legacy_backfill_state.csv || true
          git add data/status/dart_legacy_source_quarantine.csv || true
          git add data/status/dart_legacy_backfill_status.csv || true
          git add data/status/dart_legacy_coverage_by_period.csv || true
          if git diff --cached --quiet; then
            echo "No legacy DART changes"
          else
            git commit -m "Backfill legacy DART 2000-2014 PIT history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload legacy DART status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-legacy-2000-2014-status
          path: |
            ${{ runner.temp }}/legacy-collection-run.json
            data/status/dart_legacy_index_state.csv
            data/status/dart_legacy_backfill_state.csv
            data/status/dart_legacy_backfill_status.csv
            data/status/dart_legacy_coverage_by_period.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve original batch documents and audit checkpoints
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-source-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-source-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Preserve unpublished legacy checkpoint on failure
        if: failure() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-recovery-checkpoint
          path: |
            data/financials/legacy_2000_2014/
            data/status/dart_legacy_*.csv
          retention-days: 14
