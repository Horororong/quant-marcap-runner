name: Update Market Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas finance-datareader
          
      - name: Update public market and macro data
        run: |
          python update_public_data.py

      - name: Update Korean ETF data
        run: |
          python scripts/download_kr_etf.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/indices/ data/fx/ data/macro/ data/status/ data/etf_kr/

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update market and macro data"
            git push
          fi
