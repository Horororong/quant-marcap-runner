name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy finance-datareader yfinance xlrd matplotlib requests
          
      - name: Update public market and macro data
        run: |
          python update_public_data.py

      - name: Update Korean ETF data
        run: |
          python scripts/download_kr_etf.py

      - name: Update long S&P 500 history
        run: |
          python scripts/download_sp500_long.py

      - name: Update long proxy inputs
        run: |
          python scripts/download_long_proxy_inputs.py

      - name: Run long permanent portfolio backtest
        run: |
          python scripts/backtest_permanent_portfolio_long.py

      - name: Plot permanent portfolio charts
        run: |
          python scripts/plot_permanent_portfolio_long.py
          
      - name: Analyze permanent portfolio by decade
        run: |
          python scripts/analyze_permanent_portfolio_decades.py

      - name: Run permanent portfolio robustness tests
        run: |
          python scripts/robustness_permanent_portfolio_long.py

      - name: Run five-asset defensive portfolio backtest
        run: |
          python scripts/backtest_five_asset_defensive.py

      - name: Validate all data
        run: |
          python scripts/validate_all_data.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/indices/ data/fx/ data/macro/ data/status/ data/etf_kr/ data/proxy_long/ results/permanent_portfolio_long/ results/five_asset_defensive/

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "Update market data and portfolio backtests"
            git push
          fi
