name: Backtest Super Value v2-14 PIT

on:
  push:
    branches:
      - 'analysis/super-value-20260923'
    paths:
      - 'scripts/backtest_super_value_v214.py'
      - '.github/workflows/backtest-super-value-v214.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-super-value-v214
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/super-value-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow plotly
      - name: Run PIT super-value backtest
        run: python scripts/backtest_super_value_v214.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: super-value-v214-results
          path: results/super_value_v214/
          if-no-files-found: error
      - name: Commit results to analysis branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/super_value_v214/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Add super value v2-14 PIT backtest results"
            git push origin HEAD:analysis/super-value-20260923
          fi
