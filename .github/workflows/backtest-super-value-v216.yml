name: Backtest Super Value CURRENT v2-16

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/backtest_super_value_v216.py'
      - '.github/workflows/backtest-super-value-v216.yml'

permissions:
  contents: write

concurrency:
  group: backtest-super-value-v216-main
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow plotly exchange_calendars
      - name: Run CURRENT v2-16 PIT super-value backtest
        run: python scripts/backtest_super_value_v216.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: super-value-v216-main-results
          path: results/super_value_v216/
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/super_value_v216/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update super value CURRENT v2-16 results"
            git pull --rebase origin main
            git push
          fi
