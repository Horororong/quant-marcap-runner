name: Backtest Anchor Sail Moat

on:
  push:
    paths:
      - 'scripts/backtest_anchor_sail_moat.py'
      - '.github/workflows/backtest-anchor-sail-moat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib yfinance
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          fc-cache -fv >/dev/null

      - name: Run backtest
        run: python scripts/backtest_anchor_sail_moat.py

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/anchor_sail_moat
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add anchor-sail moat backtest results'
            git push
          fi

# trigger: anchor-sail-backtest-v1
