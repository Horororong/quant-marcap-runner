name: Backtest Kang K-All Weather Originals

on:
  push:
    paths:
      - 'scripts/backtest_kang_k_allweather_original.py'
      - '.github/workflows/backtest-kang-k-allweather-original.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib yfinance
          rm -rf ~/.cache/matplotlib
      - name: Run backtest
        run: python scripts/backtest_kang_k_allweather_original.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: kang-k-allweather-original-results
          path: results/kang_k_allweather_original
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/kang_k_allweather_original
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add Kang K-All Weather original backtest results'
            git push
          fi
