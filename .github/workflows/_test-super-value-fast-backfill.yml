name: Test super-value fast PIT backfill

on:
  push:
    branches:
      - analysis/super-value-fast-backfill-20260923
    paths:
      - scripts/backfill_super_value_fast.py
      - .github/workflows/_test-super-value-fast-backfill.yml

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SUPER_VALUE_FAST_MODERN_TASKS: '20'
      SUPER_VALUE_FAST_LEGACY_DOCS: '20'
      SUPER_VALUE_FAST_LEGACY_INDEX_TASKS: '3'
      SUPER_VALUE_FAST_MODERN_WORKERS: '4'
      SUPER_VALUE_FAST_LEGACY_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/super-value-fast-backfill-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow beautifulsoup4 lxml
      - run: python scripts/backfill_super_value_fast.py
      - name: Commit test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/super_value_fast_backfill_status.csv || true
          git add data/status/dart_full_backfill_state.csv data/status/dart_legacy_*.csv || true
          git add data/financials/full_history/*.csv.gz || true
          git add data/financials/legacy_2000_2014/ || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Test super-value fast PIT backfill"
            git push origin HEAD:analysis/super-value-fast-backfill-20260923
          fi
