        run: python scripts/test_strategy_dsl_aliases.py
      - name: Validate example DSL
        run: python scripts/strategy_dsl_runner.py config/strategies/kr_equity_rank_demo.json --validate-only
      - name: Strategy DSL preflight classification test
        run: python scripts/test_strategy_dsl_preflight.py
      - name: Known corporate-action preflight exposure and real modes
        run: python scripts/test_corporate_action_preflight.py
      - name: Strategy DSL benchmark contract test
        run: python scripts/test_strategy_dsl_benchmark.py
      - name: Decile partition and execution contract test
        run: python scripts/test_strategy_dsl_deciles.py
      - name: Real KRX decile execution E2E
        run: python scripts/test_dsl_deciles_e2e.py
      - name: KRX technical factor adapter test
        run: python scripts/test_krx_technical_factor_adapter.py
      - name: KRX volatility factor adapter test
        run: python scripts/test_krx_volatility_factor_adapter.py
      - name: Factor provider registry extension test
        run: python scripts/test_factor_registry.py
      - name: Custom financial rebalance and original DART quarter oracle
        timeout-minutes: 15
        run: timeout -k 5s 840s python -u scripts/test_dart_custom_rebalance.py --real-data
      - name: Cash entitlement, liquidity and settlement execution
        run: python scripts/test_cash_share_exchange.py
      - name: Corporate action execution regression
        run: python scripts/test_corporate_action_execution.py
      - name: Integration smoke test against PROJECT v2-16
        run: python scripts/test_strategy_dsl.py
      - name: DART Super Value PIT integration
        run: python scripts/test_dart_dsl_super_value.py
      - name: Real-data DSL execution E2E
        run: python scripts/test_dsl_execution_e2e.py
      - name: Checked CLI and real KRX DART execution lifecycle
