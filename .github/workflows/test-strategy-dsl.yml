permissions:
  contents: read

concurrency:
  group: strategy-dsl-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !startsWith(github.ref_name, 'deliver/mobile-download-') && !(github.event_name == 'workflow_dispatch' && (inputs.download_existing_kit || inputs.publish_public_download)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r config/sandbox/requirements-cp312-linux-x86_64.lock
          python -m pip install requests beautifulsoup4 lxml pytest pyyaml
      - name: Legacy parser, resume and scheduled automation regressions
        timeout-minutes: 5
        run: |
          for test_file in tests/test_legacy_dart_parser.py tests/test_legacy_backfill_resume.py tests/test_legacy_backfill_automation.py tests/test_legacy_source_evidence.py; do
            timeout -k 5s 60s python -u -m pytest "$test_file" -vv -s -o faulthandler_timeout=15 || exit $?
          done
          timeout -k 5s 30s python -u scripts/test_legacy_viewer_sections.py
          timeout -k 5s 30s python -u scripts/test_legacy_schedule_gate.py
      - name: Syntax check
        run: |
          python -m py_compile scripts/strategy_dsl_run.py scripts/test_strategy_dsl_run.py scripts/test_dsl_run_e2e.py scripts/test_strategy_dsl_validation.py scripts/corporate_action_preflight.py scripts/test_corporate_action_preflight.py scripts/cash_share_exchange.py scripts/test_cash_share_exchange.py scripts/execution_contract.py scripts/export_strategy_dsl_contract.py scripts/strategy_dsl_aliases.py scripts/strategy_dsl_preflight.py scripts/krx_technical_factor_adapter.py scripts/factor_registry.py scripts/corporate_action_registry.py scripts/strategy_dsl.py scripts/strategy_dsl_runner.py scripts/dart_value_factor_adapter.py scripts/test_factor_registry.py scripts/test_strategy_dsl_aliases.py scripts/test_strategy_dsl_preflight.py scripts/test_strategy_dsl_benchmark.py scripts/test_krx_technical_factor_adapter.py scripts/test_krx_volatility_factor_adapter.py scripts/test_corporate_action_execution.py scripts/test_strategy_dsl.py scripts/test_dart_dsl_super_value.py scripts/test_dsl_execution_e2e.py scripts/strategy_dsl_deciles.py scripts/test_strategy_dsl_deciles.py scripts/test_dsl_deciles_e2e.py scripts/krx_history_audit.py scripts/test_krx_history_audit.py scripts/test_held_return_guard.py scripts/corporate_action_reconciliation.py scripts/test_corporate_action_reconciliation.py scripts/quant_backtest_template_CURRENT.py scripts/quant_backtest_template_PROJECT_v2-16_CURRENT.py scripts/quant_backtest_postprocess.py scripts/test_canonical_performance.py scripts/test_verified_autumn_splits.py scripts/krx_market_normalization.py scripts/repair_krx_market_segments.py scripts/update_krx_equities_daily.py scripts/test_krx_market_normalization.py
      - name: Offline sandbox kit failure boundaries
        run: python scripts/test_sandbox_kit.py
      - name: Check machine-readable DSL contract
        run: python scripts/export_strategy_dsl_contract.py --check
      - name: Recent DART deterministic storage and commit regression
        run: |
          python -m py_compile update_dart_financials.py scripts/test_dart_recent_storage.py
          python scripts/test_dart_recent_storage.py
      - name: Read-only Git storage growth measurement
        run: |
          python -m py_compile scripts/git_storage_snapshot.py scripts/test_git_storage_snapshot.py
          python scripts/test_git_storage_snapshot.py
      - name: Strict DSL input validation and normalization compatibility
        run: python scripts/test_strategy_dsl_validation.py
      - name: Checked execution lifecycle and CURRENT readiness
        run: python scripts/test_strategy_dsl_run.py
      - name: Canonical performance and report E2E
        run: python scripts/test_canonical_performance.py
      - name: CURRENT and PROJECT compatibility self-tests
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import quant_backtest_template_CURRENT as c; c._self_test(); from strategy_dsl_runner import load_project_engine; from pathlib import Path; load_project_engine(Path.cwd())._self_test(); print('TEMPLATE SELF-TESTS: PASS')"
      - name: KRX session coverage and real history audit
        run: python scripts/test_krx_history_audit.py
      - name: Held return guard and real verified split E2E
        run: python scripts/test_held_return_guard.py
      - name: Corporate-action reconciliation and real share-class E2E
        run: python scripts/test_corporate_action_reconciliation.py
      - name: KRX market normalization and segment restoration E2E
        run: python scripts/test_krx_market_normalization.py
      - name: Verified autumn splits and real public KRX modes
        run: python scripts/test_verified_autumn_splits.py scripts/krx_market_normalization.py scripts/repair_krx_market_segments.py scripts/update_krx_equities_daily.py scripts/test_krx_market_normalization.py
      - name: Natural-language factor alias test
        run: python scripts/test_strategy_dsl_aliases.py
      - name: Validate example DSL
        run: python scripts/strategy_dsl_runner.py config/strategies/kr_equity_rank_demo.json --validate-only
      - name: Strategy DSL preflight classification test
        run: python scripts/test_strategy_dsl_preflight.py
      - name: Known corporate-action preflight exposure and real modes
        run: python scripts/test_corporate_action_preflight.py
      - name: Strategy DSL benchmark contract test
        run: python scripts/test_strategy_dsl_benchmark.py
      - name: Decile partition and execution contract test
        run: python scripts/test_strategy_dsl_deciles.py
      - name: Real KRX decile execution E2E
        run: python scripts/test_dsl_deciles_e2e.py
      - name: KRX technical factor adapter test
        run: python scripts/test_krx_technical_factor_adapter.py
      - name: KRX volatility factor adapter test
        run: python scripts/test_krx_volatility_factor_adapter.py
      - name: Factor provider registry extension test
        run: python scripts/test_factor_registry.py
      - name: Custom financial rebalance and original DART quarter oracle
        timeout-minutes: 15
        run: timeout -k 5s 840s python -u scripts/test_dart_custom_rebalance.py --real-data
      - name: Cash entitlement, liquidity and settlement execution
        run: python scripts/test_cash_share_exchange.py
      - name: Corporate action execution regression
        run: python scripts/test_corporate_action_execution.py
      - name: Integration smoke test against PROJECT v2-16
        run: python scripts/test_strategy_dsl.py
      - name: DART Super Value PIT integration
        run: python scripts/test_dart_dsl_super_value.py
      - name: Real-data DSL execution E2E
        run: python scripts/test_dsl_execution_e2e.py
      - name: Checked CLI and real KRX DART execution lifecycle
        run: python scripts/test_dsl_run_e2e.py

  sandbox-replay:
    if: ${{ !startsWith(github.ref_name, 'deliver/mobile-download-') && !(github.event_name == 'workflow_dispatch' && (inputs.download_existing_kit || inputs.publish_public_download)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DELIVER_KIT: ${{ startsWith(github.ref_name, 'deliver/quant-sandbox-') || (github.event_name == 'workflow_dispatch' && inputs.export_kit) }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and baseline dependencies
        shell: bash
        run: |
          if [ "$DELIVER_KIT" = "true" ]; then
            ABI=$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
            python -m pip install --require-hashes -r "config/sandbox/requirements-$ABI-linux-x86_64.lock"
          else
            python -m pip install pandas numpy pyarrow exchange_calendars plotly jsonschema
          fi
      - name: Prepare checksum-locked offline wheels
        shell: bash
        run: |
          ABI=$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
          if [ "$DELIVER_KIT" = "true" ]; then
            python scripts/prepare_sandbox_wheels.py --output-dir "$RUNNER_TEMP/quant-wheels"
          else
            python scripts/prepare_sandbox_wheels.py --output-dir "$RUNNER_TEMP/quant-wheels" --runtime-target "$ABI"
          fi
      - name: Clean venv real-data replay with network blocked
        timeout-minutes: 30
        shell: bash
        run: |
          EXTRA=()
          if [ "$DELIVER_KIT" = "true" ]; then
            EXTRA=(--runtime-target cp311 --runtime-target cp312 --part-size-mib 24
              --strategy config/strategies/super_value_dart_benchmark_dsl.json
              --strategy config/strategies/kr_equity_size_deciles_research.json
              --strategy config/strategies/kr_equity_split_research.json
              --strategy config/strategies/kr_equity_dart_custom_month_research.json)
          fi
          timeout -k 10s 1750s python -u scripts/test_sandbox_kit_e2e.py --wheels-dir "$RUNNER_TEMP/quant-wheels" --work-dir "$RUNNER_TEMP/quant-replay" "${EXTRA[@]}"
      - name: Upload small verification ledger
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-replay-${{ matrix.python }}
          path: ${{ runner.temp }}/quant-replay/verification.json
          retention-days: 7
      - name: Prepare bounded download segments after verified replay
        id: delivery
        if: success() && env.DELIVER_KIT == 'true' && matrix.python == '3.12'
        shell: python
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'quant-replay'
          source, = (root / 'parts').glob('quant-sandbox-*.zip')
          dest = root / 'delivery'
          dest.mkdir()
          ledger = {'zip_name': source.name, 'zip_bytes': source.stat().st_size,
                    'zip_sha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'segments': []}
          with source.open('rb') as stream:
              for number in range(1, 33):
                  chunk = stream.read(24 * 1024**2)
                  if not chunk:
                      break
                  name = f'download.part{number:03d}'
                  (dest / name).write_bytes(chunk)
                  ledger['segments'].append({'name': name, 'bytes': len(chunk),
                                             'sha256': hashlib.sha256(chunk).hexdigest()})
              if stream.read(1):
                  raise RuntimeError('Kit exceeds the bounded 32-segment delivery budget')
          (dest / 'download_manifest.json').write_text(json.dumps(ledger, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"segment_count={len(ledger['segments'])}\n")
          print(json.dumps(ledger, indent=2))
      - name: Upload delivery integrity ledger
        if: success() && env.DELIVER_KIT == 'true' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: quant-kit-download-ledger
          path: |
            ${{ runner.temp }}/quant-replay/delivery/download_manifest.json
            ${{ runner.temp }}/quant-replay/verification.json
            ${{ runner.temp }}/quant-replay/parts/kit_manifest.json
          retention-days: 30
      - name: Upload download segment 001
        if: success() && env.DELIVER_KIT == 'true' && matrix.python == '3.12' && fromJSON(steps.delivery.outputs.segment_count) >= 1
        uses: actions/upload-artifact@v4
        with:
          name: quant-kit-download-001
          path: ${{ runner.temp }}/quant-replay/delivery/download.part001
          compression-level: 0
          retention-days: 30
      - name: Upload download segment 002
