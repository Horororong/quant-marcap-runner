name: Test Strategy DSL v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/strategy_dsl.py'
      - 'scripts/krx_technical_factor_adapter.py'
      - 'scripts/test_krx_technical_factor_adapter.py'
      - 'scripts/test_krx_volatility_factor_adapter.py'
      - 'scripts/strategy_dsl_preflight.py'
      - 'scripts/corporate_action_preflight.py'
      - 'scripts/test_corporate_action_preflight.py'
      - 'docs/CORPORATE_ACTION_PREFLIGHT.md'
      - 'scripts/test_strategy_dsl_preflight.py'
      - 'scripts/test_strategy_dsl_benchmark.py'
      - 'scripts/strategy_dsl_aliases.py'
      - 'scripts/test_strategy_dsl_aliases.py'
      - 'scripts/execution_contract.py'
      - 'scripts/krx_market_normalization.py'
      - 'scripts/repair_krx_market_segments.py'
      - 'scripts/update_krx_equities_daily.py'
      - 'scripts/test_krx_market_normalization.py'
      - 'docs/KRX_MARKET_NORMALIZATION.md'
      - 'docs/audits/kosdaq-global-repair/**'
      - 'data/krx_equities/yearly/marcap-202[2-6].parquet'
      - 'scripts/krx_history_audit.py'
      - 'scripts/test_krx_history_audit.py'
      - 'scripts/test_held_return_guard.py'
      - 'scripts/corporate_action_reconciliation.py'
      - 'scripts/test_corporate_action_reconciliation.py'
      - 'scripts/test_verified_autumn_splits.py'
      - 'scripts/export_strategy_dsl_contract.py'
      - 'config/strategy_dsl_schema_v1.json'
      - 'config/strategy_dsl_capabilities_v1.json'
      - 'docs/STRATEGY_DSL.md'
      - 'BACKTEST_START_HERE.md'
      - 'HANDOFF_CURRENT.md'
      - 'scripts/factor_registry.py'
      - 'scripts/corporate_action_registry.py'
      - 'scripts/cash_share_exchange.py'
      - 'scripts/test_cash_share_exchange.py'
      - 'docs/CASH_SHARE_EXCHANGE.md'
      - 'scripts/test_corporate_action_execution.py'
      - 'config/kr_corporate_actions.csv'
      - 'config/kr_corporate_action_gaps.json'
      - 'docs/audits/jeisys-cash-exchange/**'
      - 'scripts/test_factor_registry.py'
      - 'scripts/strategy_dsl_runner.py'
      - 'scripts/strategy_dsl_deciles.py'
      - 'scripts/test_strategy_dsl_deciles.py'
      - 'scripts/test_dsl_deciles_e2e.py'
      - 'scripts/dart_value_factor_adapter.py'
      - 'scripts/test_dart_dsl_super_value.py'
      - 'scripts/test_dsl_execution_e2e.py'
      - 'scripts/test_strategy_dsl.py'
      - 'config/strategies/**'
      - '.github/workflows/test-strategy-dsl.yml'
      - 'scripts/quant_backtest_template_PROJECT_v2-16_CURRENT.py'
      - 'scripts/quant_backtest_template_CURRENT.py'
      - 'scripts/quant_backtest_postprocess.py'
      - 'scripts/test_canonical_performance.py'
      - 'config/testing/canonical_performance_v215_baseline.json'
      - 'docs/CANONICAL_PERFORMANCE.md'

permissions:
  contents: read

concurrency:
  group: strategy-dsl-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow exchange_calendars plotly jsonschema requests
      - name: Syntax check
        run: |
          python -m py_compile scripts/corporate_action_preflight.py scripts/test_corporate_action_preflight.py scripts/cash_share_exchange.py scripts/test_cash_share_exchange.py scripts/execution_contract.py scripts/export_strategy_dsl_contract.py scripts/strategy_dsl_aliases.py scripts/strategy_dsl_preflight.py scripts/krx_technical_factor_adapter.py scripts/factor_registry.py scripts/corporate_action_registry.py scripts/strategy_dsl.py scripts/strategy_dsl_runner.py scripts/dart_value_factor_adapter.py scripts/test_factor_registry.py scripts/test_strategy_dsl_aliases.py scripts/test_strategy_dsl_preflight.py scripts/test_strategy_dsl_benchmark.py scripts/test_krx_technical_factor_adapter.py scripts/test_krx_volatility_factor_adapter.py scripts/test_corporate_action_execution.py scripts/test_strategy_dsl.py scripts/test_dart_dsl_super_value.py scripts/test_dsl_execution_e2e.py scripts/strategy_dsl_deciles.py scripts/test_strategy_dsl_deciles.py scripts/test_dsl_deciles_e2e.py scripts/krx_history_audit.py scripts/test_krx_history_audit.py scripts/test_held_return_guard.py scripts/corporate_action_reconciliation.py scripts/test_corporate_action_reconciliation.py scripts/quant_backtest_template_CURRENT.py scripts/quant_backtest_template_PROJECT_v2-16_CURRENT.py scripts/quant_backtest_postprocess.py scripts/test_canonical_performance.py scripts/test_verified_autumn_splits.py scripts/krx_market_normalization.py scripts/repair_krx_market_segments.py scripts/update_krx_equities_daily.py scripts/test_krx_market_normalization.py
      - name: Check machine-readable DSL contract
        run: python scripts/export_strategy_dsl_contract.py --check
      - name: Canonical performance and report E2E
        run: python scripts/test_canonical_performance.py
      - name: CURRENT and PROJECT compatibility self-tests
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import quant_backtest_template_CURRENT as c; c._self_test(); from strategy_dsl_runner import load_project_engine; from pathlib import Path; load_project_engine(Path.cwd())._self_test(); print('TEMPLATE SELF-TESTS: PASS')"
      - name: KRX session coverage and real history audit
        run: python scripts/test_krx_history_audit.py
      - name: Held return guard and real verified split E2E
        run: python scripts/test_held_return_guard.py
      - name: Corporate-action reconciliation and real share-class E2E
        run: python scripts/test_corporate_action_reconciliation.py
      - name: KRX market normalization and segment restoration E2E
        run: python scripts/test_krx_market_normalization.py
      - name: Verified autumn splits and real public KRX modes
        run: python scripts/test_verified_autumn_splits.py scripts/krx_market_normalization.py scripts/repair_krx_market_segments.py scripts/update_krx_equities_daily.py scripts/test_krx_market_normalization.py
      - name: Natural-language factor alias test
        run: python scripts/test_strategy_dsl_aliases.py
      - name: Validate example DSL
        run: python scripts/strategy_dsl_runner.py config/strategies/kr_equity_rank_demo.json --validate-only
      - name: Strategy DSL preflight classification test
        run: python scripts/test_strategy_dsl_preflight.py
      - name: Known corporate-action preflight exposure and real modes
        run: python scripts/test_corporate_action_preflight.py
      - name: Strategy DSL benchmark contract test
        run: python scripts/test_strategy_dsl_benchmark.py
      - name: Decile partition and execution contract test
        run: python scripts/test_strategy_dsl_deciles.py
      - name: Real KRX decile execution E2E
        run: python scripts/test_dsl_deciles_e2e.py
      - name: KRX technical factor adapter test
        run: python scripts/test_krx_technical_factor_adapter.py
      - name: KRX volatility factor adapter test
        run: python scripts/test_krx_volatility_factor_adapter.py
      - name: Factor provider registry extension test
        run: python scripts/test_factor_registry.py
      - name: Cash entitlement, liquidity and settlement execution
        run: python scripts/test_cash_share_exchange.py
      - name: Corporate action execution regression
        run: python scripts/test_corporate_action_execution.py
      - name: Integration smoke test against PROJECT v2-16
        run: python scripts/test_strategy_dsl.py
      - name: DART Super Value PIT integration
        run: python scripts/test_dart_dsl_super_value.py
      - name: Real-data DSL execution E2E
        run: python scripts/test_dsl_execution_e2e.py
