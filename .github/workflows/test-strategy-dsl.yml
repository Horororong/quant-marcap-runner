    inputs:
      publish_public_download:
        description: Publish the existing verified kit as a public release download
        type: boolean
        default: false
      download_existing_kit:
        description: Restore the already verified kit for a mobile HTTPS download
        type: boolean
        default: false
      export_kit:
        description: Build and publish the four-example offline execution kit
