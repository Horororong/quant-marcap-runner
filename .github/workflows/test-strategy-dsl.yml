  sandbox-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DELIVER_KIT: ${{ startsWith(github.ref_name, 'deliver/quant-sandbox-') || (github.event_name == 'workflow_dispatch' && inputs.export_kit) }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and baseline dependencies
        shell: bash
        run: |
          if [ "$DELIVER_KIT" = "true" ]; then
            ABI=$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
            python -m pip install --require-hashes -r "config/sandbox/requirements-$ABI-linux-x86_64.lock"
          else
            python -m pip install pandas numpy pyarrow exchange_calendars plotly jsonschema
          fi
      - name: Prepare checksum-locked offline wheels
        shell: bash
        run: |
          ABI=$(python -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')
          if [ "$DELIVER_KIT" = "true" ]; then
            python scripts/prepare_sandbox_wheels.py --output-dir "$RUNNER_TEMP/quant-wheels"
          else
            python scripts/prepare_sandbox_wheels.py --output-dir "$RUNNER_TEMP/quant-wheels" --runtime-target "$ABI"
          fi
      - name: Clean venv real-data replay with network blocked
        timeout-minutes: 30
        shell: bash
        run: |
          EXTRA=()
          if [ "$DELIVER_KIT" = "true" ]; then
            EXTRA=(--runtime-target cp311 --runtime-target cp312 --part-size-mib 24
              --strategy config/strategies/super_value_dart_benchmark_dsl.json
              --strategy config/strategies/kr_equity_size_deciles_research.json
              --strategy config/strategies/kr_equity_split_research.json
              --strategy config/strategies/kr_equity_dart_custom_month_research.json)
          fi
          timeout -k 10s 1750s python -u scripts/test_sandbox_kit_e2e.py --wheels-dir "$RUNNER_TEMP/quant-wheels" --work-dir "$RUNNER_TEMP/quant-replay" "${EXTRA[@]}"
      - name: Upload small verification ledger
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-replay-${{ matrix.python }}
          path: ${{ runner.temp }}/quant-replay/verification.json
          retention-days: 7
      - name: Prepare bounded download segments after verified replay
        id: delivery
        if: success() && env.DELIVER_KIT == 'true' && matrix.python == '3.12'
        shell: python
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'quant-replay'
          source, = (root / 'parts').glob('quant-sandbox-*.zip')
          dest = root / 'delivery'
          dest.mkdir()
          ledger = {'zip_name': source.name, 'zip_bytes': source.stat().st_size,
                    'zip_sha256': hashlib.sha256(source.read_bytes()).hexdigest(), 'segments': []}
          with source.open('rb') as stream:
              for number in range(1, 33):
                  chunk = stream.read(24 * 1024**2)
                  if not chunk:
                      break
                  name = f'download.part{number:03d}'
                  (dest / name).write_bytes(chunk)
                  ledger['segments'].append({'name': name, 'bytes': len(chunk),
                                             'sha256': hashlib.sha256(chunk).hexdigest()})
              if stream.read(1):
                  raise RuntimeError('Kit exceeds the bounded 32-segment delivery budget')
          (dest / 'download_manifest.json').write_text(json.dumps(ledger, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"segment_count={len(ledger['segments'])}\n")
          print(json.dumps(ledger, indent=2))
      - name: Upload delivery integrity ledger
        if: success() && env.DELIVER_KIT == 'true' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: quant-kit-download-ledger
          path: |
            ${{ runner.temp }}/quant-replay/delivery/download_manifest.json
            ${{ runner.temp }}/quant-replay/verification.json
            ${{ runner.temp }}/quant-replay/parts/kit_manifest.json
          retention-days: 30
      - name: Upload download segment 001
        if: success() && env.DELIVER_KIT == 'true' && matrix.python == '3.12' && fromJSON(steps.delivery.outputs.segment_count) >= 1
        uses: actions/upload-artifact@v4
        with:
          name: quant-kit-download-001
          path: ${{ runner.temp }}/quant-replay/delivery/download.part001
          compression-level: 0
          retention-days: 30
