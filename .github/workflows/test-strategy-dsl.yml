name: Explicit pinned-kit target validation
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full immutable research commit to validate
        required: true
        type: string
      suite:
        description: Research or bounded collection coordinator
        type: choice
        options: [research, collection, integration, parser, workspace, pit_period, trial_evidence, supplemental]
        default: research
permissions:
  contents: read
  actions: read
jobs:
  pinned-kit-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
      - name: Record exact target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/checked-target.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official pinned kit only; no Internet pip
        run: |
          if [ "${{ inputs.suite }}" = collection ] || [ "${{ inputs.suite }}" = trial_evidence ] || [ "${{ inputs.suite }}" = supplemental ]; then
            python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          else
            python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/fixed"
          fi
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Language and saved-result provenance contracts
        if: inputs.suite == 'research' || inputs.suite == 'integration' || inputs.suite == 'workspace' || inputs.suite == 'pit_period'
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -m unittest discover -s scripts -p test_research_language.py -v
          "$PY" -I -m unittest discover -s scripts -p test_research_web.py -v
          "$PY" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");sys.argv=["scripts/export_strategy_dsl_contract.py","--check"];runpy.run_path(sys.argv[0],run_name="__main__")'
      - name: Real browser, common engine, CURRENT, independent books
        if: inputs.suite == 'research' || inputs.suite == 'integration' || inputs.suite == 'workspace' || inputs.suite == 'pit_period'
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/test_research_workspace_e2e.py --output "$RUNNER_TEMP/research-workspace"
      - name: Named CURRENT comparison guards and browser reopen
        if: inputs.suite == 'workspace' || inputs.suite == 'pit_period'
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -m unittest discover -s scripts -p test_saved_research_comparisons.py -v
          "$PY" -I scripts/test_saved_comparisons_e2e.py --source-store "$RUNNER_TEMP/research-workspace/store" --source-proof "$RUNNER_TEMP/research-workspace/browser/verification.json" --output "$RUNNER_TEMP/saved-comparisons"
      - name: PIT boundaries and partial-year period contracts
        if: inputs.suite == 'pit_period'
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -c 'import sys,unittest;sys.path[:0]=["scripts","tests"];s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x)for x in ["test_research_period_analysis","test_reviewed_financial_query","test_research_planned_readiness","test_requested_period_report","test_financial_record_readiness","test_factor_code_refactor"]);r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful())'
          "$PY" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");runpy.run_path("scripts/test_strategy_dsl_run.py",run_name="__main__")'
          "$PY" -I scripts/verify_source_pit_case.py --output "$RUNNER_TEMP/pit-source-case"
      - name: Real existing-NAV analysis and changed-period engine execution
        if: inputs.suite == 'pit_period'
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/test_research_periods_e2e.py --source-store "$RUNNER_TEMP/research-workspace/store" --source-proof "$RUNNER_TEMP/research-workspace/browser/verification.json" --output "$RUNNER_TEMP/period-workspace"
      - name: Original frozen inputs and130 strict files
        if: inputs.suite == 'integration'
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/test_frozen_integration.py --output "$RUNNER_TEMP/frozen-regression"
      - name: Bounded coordinator and real SIGKILL recovery tests
        if: inputs.suite == 'collection' || inputs.suite == 'integration'
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I -c 'import sys,unittest;sys.path[:0]=[".","tests"];s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x)for x in ["test_financial_rollout","test_financial_limited_resume","test_financial_batch_resume","test_dart_corp_code","test_legacy_backfill_resume"]);r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful())'
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I -c 'import hashlib,json;from pathlib import Path;c=json.loads(Path("config/financial_limited_resume_v1.json").read_text());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==v for p,v in c["source_code_sha256"].items());print("PASS_APPROVED_SOURCE_OWNERS_UNCHANGED")'
      - name: Readiness guards; real preflight and known-event blocking
        if: inputs.suite == 'integration'
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -m unittest discover -s scripts -p test_research_planned_readiness.py -v
          "$PY" -I -c 'import sys,runpy;sys.path.insert(0,"scripts");runpy.run_path("scripts/test_strategy_dsl_preflight.py",run_name="__main__")'
          "$PY" -I -c 'import sys,runpy;sys.path.insert(0,"scripts");runpy.run_path("scripts/test_corporate_action_preflight.py",run_name="__main__")'
      - name: Native parser approval, protection boundaries and real interruption recovery
        if: inputs.suite == 'parser'
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -c 'import sys,unittest;sys.path[:0]=[".","tests"];s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x)for x in ["test_native_source_boundary_repairs","test_financial_accuracy_repair","test_financial_backfill_v8","test_financial_extraction_stage3","test_financial_record_readiness","test_financial_rollout","test_financial_limited_resume","test_financial_batch_resume","test_legacy_backfill_resume"]);r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful())'
          "$PY" -I scripts/check_native_source_review_evidence.py --output "$RUNNER_TEMP/parser-source-evidence.json"
          "$PY" -I -c 'import hashlib,json;from pathlib import Path;c=json.loads(Path("config/financial_limited_resume_v1.json").read_text());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==v for p,v in c["source_code_sha256"].items());print("PASS_EXPLICITLY_REVIEWED_SOURCE_OWNERS")'
          "$PY" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");sys.argv=["scripts/export_strategy_dsl_contract.py","--check"];runpy.run_path(sys.argv[0],run_name="__main__")'
          echo "Exact checkout: ${{ inputs.target_sha }}" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/parser-source-evidence.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Real trial artifact and prerequisite verification; no DART requests
        if: inputs.suite == 'trial_evidence' || inputs.suite == 'supplemental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/check_finite_trial_artifact.py --output "$RUNNER_TEMP/trial-qualification.json"
      - name: Supplemental budget and original protected collector regression
        if: inputs.suite == 'supplemental'
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -c 'import sys,unittest;sys.path[:0]=[".","tests"];s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x)for x in ["test_financial_supplemental_resume","test_financial_rollout","test_financial_limited_resume","test_financial_batch_resume","test_dart_corp_code","test_legacy_backfill_resume"]);assert s.countTestCases()>=70;r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful())'
          "$PY" -I -c 'import hashlib,json;from pathlib import Path;c=json.loads(Path("config/financial_limited_resume_v1.json").read_text());assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==v for p,v in c["source_code_sha256"].items());print("PASS_UNCHANGED_APPROVED_SOURCE_OWNERS")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-kit-target-${{ inputs.target_sha }}
          path: |
            ${{ runner.temp }}/checked-target.txt
            ${{ runner.temp }}/runtime.json
            ${{ runner.temp }}/research-workspace
            ${{ runner.temp }}/frozen-regression
            ${{ runner.temp }}/parser-source-evidence.json
            ${{ runner.temp }}/saved-comparisons
            ${{ runner.temp }}/pit-source-case
            ${{ runner.temp }}/period-workspace
            ${{ runner.temp }}/trial-qualification.json
          retention-days: 90
