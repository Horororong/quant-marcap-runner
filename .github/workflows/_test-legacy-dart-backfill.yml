name: Test legacy DART 2000-2014 backfill

on:
  push:
    branches:
      - analysis/legacy-dart-build-20260923
    paths:
      - scripts/backfill_dart_legacy_2000_2014.py
      - .github/workflows/_test-legacy-dart-backfill.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-legacy-dart-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      LEGACY_DART_START_YEAR: '2000'
      LEGACY_DART_END_YEAR: '2014'
      LEGACY_DART_INDEX_TASKS: '6'
      LEGACY_DART_MAX_DOCS: '20'
      LEGACY_DART_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/legacy-dart-build-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow beautifulsoup4 lxml
      - run: python scripts/backfill_dart_legacy_2000_2014.py
      - name: Commit test outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials/legacy_2000_2014/ data/status/dart_legacy_*.csv || true
          if git diff --cached --quiet; then
            echo "No legacy DART changes"
          else
            git commit -m "Test legacy DART PIT backfill"
            git push origin HEAD:analysis/legacy-dart-build-20260923
          fi
