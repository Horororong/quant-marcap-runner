# PREPARED ONLY. Copy to .github/workflows/collect-b-official-evidence.yml
# only after explicit operating-code publication/main approval and required CI.
name: Fixed-three B official evidence; private raw; financial HOLD
on:
  pull_request:
    paths:
      - scripts/bounded_official_evidence.py
      - scripts/bounded_official_github.py
      - scripts/test_bounded_official_evidence.py
      - scripts/test_bounded_official_github.py
      - config/research/fixed_three_evidence_approval_20261028.json
      - .github/workflows/collect-b-official-evidence.yml
  workflow_dispatch:
    inputs:
      collect:
        description: Execute the approved fixed initial inventory; false only validates
        type: boolean
        default: false
concurrency:
  group: super-value-fast-pit-backfill
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  validate:
    env:
      TARGET_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /PROJECT_CHARTER.md
            /scripts/restore_pinned_financial_kit.py
            /scripts/bounded_official_evidence.py
            /scripts/bounded_official_github.py
            /scripts/test_bounded_official_evidence.py
            /scripts/test_bounded_official_github.py
            /config/research/fixed_three_evidence_approval_20261028.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact checkout and original fixed kit; no Internet pip
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_CODE_SHA"
          echo "Actual validation checkout: $TARGET_CODE_SHA"
          echo "Actual CI driver: ${{ github.workflow_sha }}"
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Offline finite-budget, interruption and private-storage tests; no source secrets
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I -c 'import sys,unittest;sys.path.insert(0,"scripts");s=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(x)for x in ["test_bounded_official_evidence","test_bounded_official_github"]);r=unittest.TextTestRunner(verbosity=2).run(s);raise SystemExit(not r.wasSuccessful())'
  collect:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.collect == true && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /PROJECT_CHARTER.md
            /scripts/restore_pinned_financial_kit.py
            /scripts/bounded_official_evidence.py
            /scripts/bounded_official_github.py
            /scripts/test_bounded_official_evidence.py
            /scripts/test_bounded_official_github.py
            /config/research/fixed_three_evidence_approval_20261028.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore fixed kit before source step; no secrets
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Fixed initial B inventory; 600 seconds includes private persistence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          B_PRIVATE_BACKUP_TOKEN: ${{ secrets.B_PRIVATE_BACKUP_TOKEN || secrets.GH_BACKUP_TOKEN }}
        run: |
          umask 077
          echo "Actual source checkout: $GITHUB_SHA"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");runpy.run_path("scripts/bounded_official_github.py",run_name="__main__")' --private-root "$RUNNER_TEMP/b-private" --grant config/research/fixed_three_evidence_approval_20261028.json > "$RUNNER_TEMP/b-summary.json"
      - name: Business outcome; a stopped or partial inventory is not B completion
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/b-summary.json" ]; then cat "$RUNNER_TEMP/b-summary.json" >> "$GITHUB_STEP_SUMMARY"; fi
      # Intentionally no public raw artifact, release, public commit or cache.
      # The journal and raw files are read back from the exact PRIVATE repo.
