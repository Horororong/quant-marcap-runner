name: Independent financial audit source review
on:
  push:
    branches: ['audit/financial-accuracy-20261014']
    paths:
      - 'docs/audits/financial-accuracy-20261014/restore_inputs.py'
      - 'docs/audits/financial-accuracy-20261014/source_view.py'
      - 'docs/audits/financial-accuracy-20261014/audit_compare.py'
      - 'docs/audits/financial-accuracy-20261014/manual_controls.json'
      - 'docs/audits/financial-accuracy-20261014/audit_narrative.md'
      - 'docs/audits/financial-accuracy-20261014/reproduction_template.md'
      - '.github/workflows/independent-financial-audit-20261014.yml'
permissions:
  contents: write
  actions: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore fixed forty-sample review and original offline kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs/audits/financial-accuracy-20261014/restore_inputs.py --workdir "$RUNNER_TEMP/independent-audit"
      - name: Bootstrap original offline kit
        run: python "$RUNNER_TEMP/independent-audit/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/independent-audit/kit-parts" --destination "$RUNNER_TEMP/independent-audit/runtime"
      - name: Verify dedicated runtime
        run: '"$RUNNER_TEMP/independent-audit/runtime/.venv/bin/python" -I "$RUNNER_TEMP/independent-audit/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/independent-audit/verify.json"'
      - name: Create literal original source views
        run: '"$RUNNER_TEMP/independent-audit/runtime/.venv/bin/python" -I docs/audits/financial-accuracy-20261014/source_view.py --workdir "$RUNNER_TEMP/independent-audit" --output docs/audits/financial-accuracy-20261014/review'
      - name: Independently compare originals and produce accuracy deliverables
        run: '"$RUNNER_TEMP/independent-audit/runtime/.venv/bin/python" -I docs/audits/financial-accuracy-20261014/audit_compare.py --workdir "$RUNNER_TEMP/independent-audit" --review docs/audits/financial-accuracy-20261014/review --controls docs/audits/financial-accuracy-20261014/manual_controls.json --output docs/audits/financial-accuracy-20261014'
      - name: Save audit viewing evidence and accuracy reports on isolated branch
        run: |
          test "$GITHUB_REF_NAME" = "audit/financial-accuracy-20261014"
          cp "$RUNNER_TEMP/independent-audit/verify.json" docs/audits/financial-accuracy-20261014/review/runtime_verify.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/financial-accuracy-20261014/
          git commit -m "Publish independent forty-sample financial accuracy audit and immutable evidence"
          git push origin HEAD:audit/financial-accuracy-20261014
