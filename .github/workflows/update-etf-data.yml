name: Update ETF Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-etf-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-etf.txt

      - name: Download ETF data
        run: |
          python scripts/download_us_etf.py
          
      - name: Build daily panels
        run: |
          python scripts/make_daily_panel.py
          
      - name: Commit updated ETF data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/etf_us/ data/derived/daily/

          if git diff --cached --quiet; then
            echo "No ETF data changes."
          else
            git commit -m "Update ETF market data"
            git push
          fi
