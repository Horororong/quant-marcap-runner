name: Backtest KR-US Relative Momentum v2-14

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_kr_us_relative_momentum_v214.py'
      - 'scripts/analyze_kr_us_relative_momentum_robustness.py'
      - '.github/workflows/backtest-kr-us-relative-momentum-v214.yml'
      - 'RUN_TRIGGER_REL_MOM.txt'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run standard v2-14 KR-US relative momentum backtest
        run: |
          python scripts/backtest_kr_us_relative_momentum_v214.py
          python scripts/analyze_kr_us_relative_momentum_robustness.py
      - name: Commit results and long proxies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/kr_us_relative_momentum_v214/ data/proxy_long/raw/OECD_KR_SHARE_PRICE_MONTHLY.csv data/proxy_long/raw/OECD_US_SHARE_PRICE_MONTHLY.csv
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Run KR-US relative momentum v2-14 backtest'
            git push
          fi
