name: Backtest K-All Weather v3

on:
  push:
    paths:
      - 'scripts/backtest_k_allweather_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Korean font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib yfinance
          rm -rf ~/.cache/matplotlib
      - name: Run K-All Weather v3 backtest
        run: python scripts/backtest_k_allweather_v3.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/k_allweather_v3
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Add K-All Weather v3 backtest results'
            git push
          fi
