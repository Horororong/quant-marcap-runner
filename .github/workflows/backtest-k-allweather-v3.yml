name: Backtest K-All Weather v3

on:
  push:
    paths:
      - 'scripts/backtest_k_allweather_v3.py'
      - '.github/workflows/backtest-k-allweather-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Korean font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib yfinance
          rm -rf ~/.cache/matplotlib
      - name: Use repository LBMA gold history
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/backtest_k_allweather_v3.py')
          s = p.read_text(encoding='utf-8')
          old = '    gold_usd = month_last(fred("GOLDPMGBD228NLBM")).reindex(months).ffill()'
          new = '''    gold_raw = pd.read_csv(ROOT / "data" / "proxy_long" / "raw" / "GOLD_LBMA_PM_USD.csv")
    gold_raw["Date"] = pd.to_datetime(gold_raw["Date"], errors="coerce")
    gold_raw["Close"] = pd.to_numeric(gold_raw["Close"], errors="coerce")
    gold_usd = month_last(pd.Series(gold_raw["Close"].values, index=gold_raw["Date"]).dropna()).reindex(months).ffill()'''
          if old not in s:
              raise SystemExit('Expected gold source line not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Run K-All Weather v3 backtest
        run: python scripts/backtest_k_allweather_v3.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/k_allweather_v3
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Add K-All Weather v3 backtest results'
            git push
          fi
