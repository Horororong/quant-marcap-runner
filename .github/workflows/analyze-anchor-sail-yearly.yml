name: Analyze Anchor Sail Yearly

on:
  push:
    paths:
      - 'scripts/analyze_anchor_sail_yearly.py'
      - '.github/workflows/analyze-anchor-sail-yearly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Run yearly analysis
        run: python scripts/analyze_anchor_sail_yearly.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/anchor_sail_moat/yearly_return_mdd.csv results/anchor_sail_moat/yearly_return_mdd_wide.csv results/anchor_sail_moat/period_cagr_diagnostics.csv results/anchor_sail_moat/cagr_2025_lift.csv
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add yearly anchor-sail diagnostics'
            git push
          fi
