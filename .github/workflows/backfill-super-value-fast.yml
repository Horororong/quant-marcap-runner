name: Fast-backfill super-value PIT inputs

on:
  workflow_dispatch:
  schedule:
    # 00:30 KST daily = 15:30 UTC previous day.
    # Dedicated catch-up path for the super-value strategy.
    - cron: '30 15 * * *'

concurrency:
  group: dart-historical-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      DART_COLLECTION_MAX_SECONDS: '16800'
      SUPER_VALUE_FAST_MODERN_TASKS: '4500'
      SUPER_VALUE_FAST_LEGACY_DOCS: '6000'
      SUPER_VALUE_FAST_LEGACY_INDEX_TASKS: '119'
      SUPER_VALUE_FAST_MODERN_WORKERS: '6'
      SUPER_VALUE_FAST_LEGACY_WORKERS: '6'
      DART_COLLECTION_SCOPE: 'all_filings'
      DART_STATEMENT_SCOPE: 'both'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow beautifulsoup4 lxml

      - name: Prioritize super-value PIT inputs
        run: python scripts/backfill_super_value_fast.py

      - name: Refresh authoritative collection summaries even after failure
        if: always()
        run: python scripts/dart_backfill_health.py --refresh

      - name: Commit fast-backfill datasets and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials/dart_historical_code_map.csv || true
          git add data/financials/full_history/*.csv.gz || true
          git add data/financials/legacy_2000_2014/ || true
          git add data/status/dart_full_backfill_state.csv || true
          git add data/status/dart_legacy_*.csv || true
          git add data/status/super_value_fast_backfill_status.csv || true
          git add data/financials/dart_raw/ || true
          git add data/status/dart_full_backfill_status.csv data/status/dart_pit_coverage*.csv || true
          git add data/status/dart_fast_collection_run.json data/status/dart_collection_health.json || true
          if git diff --cached --quiet; then
            echo "No super-value fast-backfill changes"
          else
            git commit -m "Fast-backfill super-value PIT inputs"
            git pull --rebase origin main
            git push
          fi

      - name: Upload fast-backfill status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-value-fast-backfill-status
          path: |
            data/status/super_value_fast_backfill_status.csv
            data/status/dart_legacy_backfill_status.csv
            data/status/dart_full_backfill_status.csv
            data/status/dart_fast_collection_run.json
            data/status/dart_collection_health.json
            data/status/dart_pit_coverage_status.csv
          if-no-files-found: warn

      - name: Preserve raw sources and checkpoints after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dart-raw-recovery-${{ github.run_id }}
          compression-level: 0
          retention-days: 90
          path: |
            data/financials/dart_raw/
            data/financials/full_history/
            data/financials/legacy_2000_2014/
            data/status/dart*
          if-no-files-found: warn
