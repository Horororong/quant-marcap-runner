name: Fast-backfill super-value PIT inputs
on:
  workflow_dispatch:
    inputs:
      bounded_verification:
        description: Explicit first canary only; at most10 documents, candidates held for independent review
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_dart_legacy_2000_2014.py'
      - 'scripts/financial_rollout.py'
      - 'config/financial_backfill_rollout.json'
      - '.github/workflows/backfill-super-value-fast.yml'
  schedule:
    - cron: '30 15 * * *'
    - cron: '30 7,23 * 10 *'
concurrency:
  group: super-value-fast-pit-backfill
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  bounded-canary:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[financial-canary-100]')) || (github.event_name == 'workflow_dispatch' && inputs.bounded_verification))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original immutable offline environment
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: First operating verification; fixed10 documents; no automatic publication
        timeout-minutes: 12
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_rollout.py --mode operational --max-docs 10 --output "$RUNNER_TEMP/operating-canary"'
      - name: Transfer public bounded candidates for independent review, no ref update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_rollout_transfer.py "$RUNNER_TEMP/operating-canary"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-operating-canary-candidates-HELD
          path: |
            ${{ runner.temp }}/operating-canary
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
# Schedules deliberately cannot start collection. No legacy-v5 or2000 fallback.
# Publish candidates only after independent field review in a separate data commit.
