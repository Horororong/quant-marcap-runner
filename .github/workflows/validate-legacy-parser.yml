name: Validate legacy parser schema

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backfill_dart_legacy_2000_2014.py'
      - 'scripts/backfill_super_value_fast.py'
      - 'scripts/legacy_backfill_runtime.py'
      - 'scripts/legacy_schedule_gate.py'
      - 'scripts/test_legacy_schedule_gate.py'
      - 'scripts/csv_storage.py'
      - 'scripts/probe_dart_legacy_sources.py'
      - 'scripts/capture_legacy_viewer_sections.py'
      - 'scripts/test_legacy_viewer_sections.py'
      - 'scripts/legacy_financial_fields.py'
      - 'scripts/legacy_viewer_source.py'
      - 'scripts/test_legacy_viewer_source.py'
      - 'scripts/replay_legacy_viewer_sources.py'
      - 'scripts/recheck_legacy_primary_audit.py'
      - 'docs/audits/legacy/initial-financial-body-routes-20261002.json'
      - 'scripts/audit_legacy_pit_sample.py'
      - 'tests/test_legacy*.py'
      - 'tests/fixtures/legacy_dart/**'
      - '.github/workflows/backfill-super-value-fast.yml'
      - '.github/workflows/backfill-dart-legacy-2000-2014.yml'
      - '.github/workflows/validate-legacy-parser.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install pandas requests beautifulsoup4 lxml pytest pyyaml
      - name: Legacy parser and resume regressions
        timeout-minutes: 5
        run: |
          for test_file in tests/test_legacy_dart_parser.py tests/test_legacy_backfill_resume.py tests/test_legacy_backfill_automation.py tests/test_legacy_source_evidence.py; do
            timeout -k 5s 60s python -u -m pytest "$test_file" -vv -s -o faulthandler_timeout=15 || exit $?
          done
          timeout -k 5s 30s python -u scripts/test_legacy_viewer_sections.py
          timeout -k 5s 30s python -u scripts/test_legacy_viewer_source.py
          timeout -k 5s 60s python -u scripts/recheck_legacy_primary_audit.py --output-dir "$RUNNER_TEMP/legacy-primary-72-recheck"
          timeout -k 5s 30s python -u scripts/test_legacy_schedule_gate.py
      - name: Preserve actual-checkout independent source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-primary-72-recheck
          path: ${{ runner.temp }}/legacy-primary-72-recheck
          if-no-files-found: error
          retention-days: 90
      - name: Compile parser
        run: python -m py_compile scripts/backfill_dart_legacy_2000_2014.py scripts/backfill_super_value_fast.py
      - name: Schema sanity
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import backfill_dart_legacy_2000_2014 as m
          required = {
              "equity","revenue","net_income","ocf",
              "total_assets","total_liabilities","current_assets","current_liabilities",
              "cash_and_equivalents","short_term_borrowings","long_term_borrowings",
              "operating_income","gross_profit","ppe","capex_ppe",
              "depreciation","amortization","dividends_paid",
              "cash_dividend_total","dividend_per_share",
          }
          missing = required - set(m.ALIASES)
          assert not missing, f"missing canonical metrics: {sorted(missing)}"
          assert m.CORE_4F == {"equity","revenue","net_income","ocf"}
          print("legacy schema OK:", m.PARSER_VERSION, len(m.ALIASES), "canonical metrics")
          PY
