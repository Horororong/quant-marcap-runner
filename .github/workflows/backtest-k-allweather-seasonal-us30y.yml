name: Backtest K-All Weather Seasonal US30Y

on:
  push:
    paths:
      - 'scripts/backtest_k_allweather_seasonal_us30y.py'
      - '.github/workflows/backtest-k-allweather-seasonal-us30y.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and Korean font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib
          rm -rf ~/.cache/matplotlib
      - name: Run seasonal backtest
        run: python scripts/backtest_k_allweather_seasonal_us30y.py
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: k-allweather-seasonal-us30y-results
          path: results/k_allweather_seasonal_us30y
          if-no-files-found: error
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/k_allweather_seasonal_us30y
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Add K-All Weather seasonal US30Y backtest results'
            git push
          fi
