name: Backfill DART value-factor history

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backfill_dart_value_factors.py'
      - '.github/workflows/backfill-dart-value-factors.yml'
  schedule:
    # 08:30 KST every day = 23:30 UTC previous day.
    # Runs after the main 07:30 KST market/recent-DART update.
    - cron: '30 23 * * *'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      DART_BACKFILL_TASKS: ${{ vars.DART_BACKFILL_TASKS || '3000' }}
      DART_BACKFILL_WORKERS: ${{ vars.DART_BACKFILL_WORKERS || '6' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Backfill historical DART value-factor inputs
        run: python scripts/backfill_dart_value_factors.py

      - name: Commit backfill datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/financials/dart_historical_code_map.csv \
            data/financials/dart_value_factor_candidates.csv.gz \
            data/status/dart_value_backfill_state.csv \
            data/status/dart_value_backfill_status.csv
          if git diff --cached --quiet; then
            echo "No DART value-factor backfill changes"
          else
            git commit -m "Backfill DART value-factor history"
            git push
          fi

      - name: Upload backfill status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-value-backfill-status
          path: data/status/dart_value_backfill_status.csv
          if-no-files-found: warn
