name: Backfill full DART financial-statement history

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backfill_dart_full_financials.py'
      - 'scripts/run_full_dart_backfill.py'
      - '.github/workflows/backfill-dart-value-factors.yml'
  schedule:
    # 08:30 KST every day = 23:30 UTC previous day.
    # Runs after the main market/recent-DART update.
    - cron: '30 23 * * *'

concurrency:
  group: dart-full-history-backfill
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      DART_FULL_BACKFILL_TASKS: ${{ vars.DART_FULL_BACKFILL_TASKS || '3000' }}
      DART_FULL_BACKFILL_WORKERS: ${{ vars.DART_FULL_BACKFILL_WORKERS || '6' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Backfill full historical DART statements
        run: python scripts/run_full_dart_backfill.py

      - name: Commit full-history datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials/dart_historical_code_map.csv
          git add data/status/dart_full_backfill_state.csv data/status/dart_full_backfill_status.csv
          git add data/financials/full_history/*.csv.gz || true
          if git diff --cached --quiet; then
            echo "No DART full-history backfill changes"
          else
            git commit -m "Backfill full DART financial-statement history"
            git push
          fi

      - name: Upload backfill status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-full-backfill-status
          path: data/status/dart_full_backfill_status.csv
          if-no-files-found: warn
