name: Audit legacy PIT sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      LEGACY_AUDIT_SAMPLE: '24'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Audit committed legacy PIT sample
        run: python scripts/audit_legacy_pit_sample.py

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/legacy_pit_audit_sample.csv data/status/legacy_pit_audit_summary.csv
          git diff --cached --quiet || git commit -m "Audit legacy PIT sample"
          git pull --rebase origin main
          git push
