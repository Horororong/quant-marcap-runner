name: Audit legacy PIT sample

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_dart_legacy_sources.py'
      - 'scripts/audit_legacy_pit_sample.py'
      - '.github/workflows/audit-legacy-pit.yml'

concurrency:
  group: super-value-fast-pit-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      LEGACY_AUDIT_SAMPLE: '24'
      LEGACY_DART_MAX_REQUESTS: '160'
      LEGACY_DART_MAX_SECONDS: '900'
      LEGACY_DART_REQUEST_INTERVAL: '0.5'

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Capture representative original-source evidence
        timeout-minutes: 12
        env:
          LEGACY_SOURCE_ARTIFACT_DIR: ${{ runner.temp }}/legacy-original-sources
        run: python scripts/probe_dart_legacy_sources.py

      - name: Check committed legacy reparse consistency
        timeout-minutes: 20
        run: python scripts/audit_legacy_pit_sample.py

      - name: Commit audit report
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/legacy_pit_audit_sample.csv data/status/legacy_pit_audit_summary.csv
          git add 'docs/audits/legacy/source_probes/*.json' || true
          if ! git diff --cached --quiet; then
            git commit -m "Capture legacy source evidence and reparse consistency"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Preserve original documents for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-original-source-evidence
          path: |
            ${{ runner.temp }}/legacy-original-sources/
            docs/audits/legacy/source_probes/*.json
            data/status/legacy_pit_audit_sample.csv
            data/status/legacy_pit_audit_summary.csv
          retention-days: 90
          if-no-files-found: warn
