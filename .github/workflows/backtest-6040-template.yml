name: Backtest 60-40 with standard template v2-8

on:
  push:
    paths:
      - 'scripts/quant_backtest_template_v2_8.py'
      - 'scripts/backtest_6040_template.py'
      - '.github/workflows/backtest-6040-template.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run attached standard template self-test
        run: python scripts/quant_backtest_template_v2_8.py
      - name: Run 60-40 through standard template
        run: python scripts/backtest_6040_template.py
      - name: Commit template-based results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/60_40_template_v28
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add 60-40 standard-template backtest results'
            git push
          fi
