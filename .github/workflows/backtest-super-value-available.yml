name: Backtest Super Value Available Data

on:
  push:
    branches:
      - 'analysis/super-value-20260923'
    paths:
      - 'scripts/backtest_super_value_available.py'
      - '.github/workflows/backtest-super-value-available.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/super-value-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy pyarrow requests plotly
      - run: python scripts/backtest_super_value_available.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/super_value_available/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add available-data super value backtest results"
            git push origin HEAD:analysis/super-value-20260923
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: super-value-available-results
          path: results/super_value_available/
          if-no-files-found: warn
