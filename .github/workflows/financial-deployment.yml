name: Financial bounded deployment evidence
on:
  push:
    branches: ['deploy/financial-backfill-v9-*', main]
  pull_request:
    branches: [main]
    paths: ['scripts/*financial*', 'scripts/*dart*', 'scripts/*legacy*', 'tests/test_financial*', '.github/workflows/financial-deployment.yml', 'config/financial_backfill_rollout.json', 'data/financials/legacy_2000_2014/quality_v9/**', 'docs/audits/financial-deployment-20261018/**', 'docs/audits/financial-validation-100-20261019/**']
permissions:
  contents: read
  actions: read
jobs:
  source-publication-proof:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/deploy/financial-backfill-v9-') && github.run_attempt == 1 && contains(github.event.head_commit.message, '[source-readiness-proof]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify pinned kit; no pip
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Three existing filing viewers and bounded official metadata only
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_publication_probe.py --output "$RUNNER_TEMP/publication-proof"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-publication-proof
          path: |
            ${{ runner.temp }}/publication-proof
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
  source-validation100-replay:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[financial-fixed-kit-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original pinned offline kit
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Actual common collector on frozen100 and prior10; no HTTP credentials or recollection
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_validation_replay.py docs/audits/financial-validation-100-20261019 --output "$RUNNER_TEMP/replay100"'
      - name: Exact canonical financial bytes and frozen independent control/publication checks
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -c 'import base64,gzip,os;from pathlib import Path;a=Path(os.environ["RUNNER_TEMP"])/"replay100/subjects_v92.json.gz.b64";b=Path("docs/audits/financial-validation-100-20261019/subjects_v92.json.gz.b64");assert gzip.decompress(base64.b64decode(a.read_bytes()))==gzip.decompress(base64.b64decode(b.read_bytes())),"CANONICAL_FINANCIAL_BYTES_DIFFER"'
          "$PY" -I scripts/financial_review_gate.py docs/audits/financial-validation-100-20261019 --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-source100-replay-NO-HTTP
          path: |
            ${{ runner.temp }}/replay100/summary.json
            ${{ runner.temp }}/replay100/subjects_v92.json.gz.b64
            ${{ runner.temp }}/replay100/chunk*/run_status.json
            ${{ runner.temp }}/replay100/chunk*/workers/*/worker.log
            ${{ runner.temp }}/replay100/chunk*/workers/*/progress.jsonl
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
  finite-validation100:
    needs: fixed-kit-financial-validation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/deploy/financial-backfill-v9-') && github.run_attempt == 1 && contains(github.event.head_commit.message, '[financial-validation100]')
    permissions:
      contents: write
    concurrency:
      group: super-value-fast-pit-backfill
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pinned kit; no dependency installation
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Freeze100 untouched receipts and review rule BEFORE HTTP or amounts
        run: |
          mkdir -p "$RUNNER_TEMP/validation100"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_validation_batch.py freeze --plan "$RUNNER_TEMP/validation100/batch_plan.json"
      - name: Five finite20-document runs; HOLD and no data publication
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          for chunk in 0 1 2 3 4; do
            code=0
            "$PY" -I scripts/financial_validation_batch.py collect --plan "$RUNNER_TEMP/validation100/batch_plan.json" --output "$RUNNER_TEMP/validation100" --chunk "$chunk" || code=$?
            folder=$(printf 'chunk%02d' "$chunk")
            cp "$RUNNER_TEMP/validation100/batch_plan.json" "$RUNNER_TEMP/validation100/$folder/batch_plan.json"
            "$PY" -I scripts/financial_rollout_transfer.py "$RUNNER_TEMP/validation100/$folder"
            if [ "$code" -ne 0 ]; then exit "$code"; fi
          done
          "$PY" -I scripts/financial_validation_batch.py review-selection --plan "$RUNNER_TEMP/validation100/batch_plan.json" --output "$RUNNER_TEMP/validation100"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-validation100-sources-and-checkpoints-HELD
          path: |
            ${{ runner.temp }}/validation100
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
  fixed-kit-financial-validation:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[financial-fixed-kit-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original immutable offline kit
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Actual rollout transport deadline and financial regressions; source cells are separate oracles
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -m unittest discover -s tests -p 'test_financial*.py' -v
          "$PY" -I -m unittest discover -s tests -p 'test_legacy_dart_parser.py' -v
          "$PY" -I -m unittest discover -s scripts -p 'test_dart_service_status.py' -v
          "$PY" -I -m unittest discover -s scripts -p 'test_fast_backfill_phase_policy.py' -v
          "$PY" -I -m unittest discover -s scripts -p 'test_legacy_document_quality.py' -v
          "$PY" -I -c 'import runpy,sys;from pathlib import Path;sys.path.insert(0,str(Path.cwd()/"scripts"));sys.argv=["scripts/export_strategy_dsl_contract.py","--check"];runpy.run_path(sys.argv[0],run_name="__main__")'
          "$PY" -I scripts/financial_deployment_replay.py --source docs/audits/financial-deployment-20261018/independent_originals.json.gz.b64 --output "$RUNNER_TEMP/new12-replay"
          "$PY" -I scripts/financial_deployment_audit.py --source docs/audits/financial-deployment-20261018/independent_originals.json.gz.b64 --controls docs/audits/financial-deployment-20261018/independent_controls.json --replay "$RUNNER_TEMP/new12-replay" --output "$RUNNER_TEMP/new12-audit"
          cmp "$RUNNER_TEMP/new12-audit/details.csv" docs/audits/financial-deployment-20261018/results/details.csv
          cmp "$RUNNER_TEMP/new12-audit/summary.json" docs/audits/financial-deployment-20261018/results/summary.json
          if [[ -f docs/audits/financial-deployment-20261018/operating_summary.json ]]; then
            "$PY" -I scripts/financial_operating_evidence.py
          fi
          if [[ -f docs/audits/financial-validation-100-20261019/controls.json ]]; then
            "$PY" -I scripts/financial_review_gate.py docs/audits/financial-validation-100-20261019 --check
          fi
      - uses: actions/checkout@v4
        with:
          ref: 0d3669bd45a77d7d7cc03cabcac1fad7963461ff
          path: audit-reference
      - name: Validate candidate code against immutable22 financial controls,518/64 and original60
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          for file in backfill_dart_legacy_2000_2014.py backfill_super_value_fast.py legacy_native_financials.py legacy_financial_fields.py legacy_parser_migration.py dart_service_status.py dart_http.py; do
            cp "scripts/$file" "audit-reference/scripts/$file"
          done
          cp scripts/test_dart_service_status.py audit-reference/scripts/test_dart_service_status.py
          cp scripts/financial_candidate_regression.py audit-reference/docs/audits/backfill-accuracy-20261018/candidate_regression.py
          cp scripts/financial_candidate_patch_regression.py audit-reference/docs/audits/backfill-accuracy-20261018/candidate_patch_regression.py
          "$PY" -I audit-reference/docs/audits/version-pit-stage6-20261014/verify_preserved60.py --output "$RUNNER_TEMP/preserved60"
          "$PY" -I audit-reference/docs/audits/backfill-accuracy-20261018/candidate_regression.py --candidate-manifest "$GITHUB_WORKSPACE/docs/audits/financial-validation-100-20261019/parser_candidate.json" --check --originals "$RUNNER_TEMP/preserved60/originals60.zip" --runtime "$RUNNER_TEMP/fixed/runtime" --output "$RUNNER_TEMP/protected-financial-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-financial-fixed-kit-validation
          path: |
            ${{ runner.temp }}/new12-replay
            ${{ runner.temp }}/new12-audit
            ${{ runner.temp }}/protected-financial-audit
            ${{ runner.temp }}/preserved60/verification.json
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
  shadow-live-http:
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[financial-shadow-http]')
    permissions:
      contents: write
    concurrency:
      group: super-value-fast-pit-backfill
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original fixed kit
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Existing authenticated DART route, first2 prior800 candidates, no historic state reset
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_rollout.py --mode shadow-http --selection docs/audits/financial-deployment-20261018/http_canary_selection.json --max-docs 2 --output "$RUNNER_TEMP/http-shadow"'
      - name: Public source transfer without credentials or ref changes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_rollout_transfer.py "$RUNNER_TEMP/http-shadow"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-shadow-live-HTTP
          path: |
            ${{ runner.temp }}/http-shadow
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
  independent-source-freeze:
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[independent-source-freeze]')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore immutable offline kit, no internet pip
        run: |
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Freeze twelve new corporations before opening values; existing originals only
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/financial_deployment_sources.py --output "$RUNNER_TEMP/selected"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-deployment-selected-originals
          path: |
            ${{ runner.temp }}/selected/selected_receipts.json
            ${{ runner.temp }}/selected/transfer.json
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
