name: Accelerate super-value contiguous PIT signals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_super_value_signals.py'

concurrency:
  group: dart-historical-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  accelerate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      DART_COLLECTION_MAX_SECONDS: '13200'
      SUPER_VALUE_SIGNAL_TASKS: '6000'
      SUPER_VALUE_SIGNAL_BATCH: '500'
      SUPER_VALUE_SIGNAL_WORKERS: '6'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyarrow plotly exchange_calendars

      - name: Fill only the next required super-value PIT signals
        run: python scripts/backfill_super_value_signals.py

      - name: Re-run super-value backtest on the newly verified window
        id: backtest
        run: python scripts/backtest_super_value_v216.py

      - name: Refresh authoritative collection summaries even after failure
        if: always()
        run: python scripts/dart_backfill_health.py --refresh

      - name: Commit targeted PIT inputs and refreshed backtest
        if: always()
        env:
          BACKTEST_PASSED: ${{ steps.backtest.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials/dart_historical_code_map.csv || true
          git add data/financials/full_history/*.csv.gz || true
          git add data/status/dart_full_backfill_state.csv || true
          git add data/status/super_value_signal_backfill_status.csv || true
          git add data/financials/dart_raw/ || true
          git add data/status/dart_full_backfill_status.csv data/status/dart_pit_coverage*.csv data/status/dart_collection_health.json || true
          if [ "$BACKTEST_PASSED" = "true" ]; then
            git add results/super_value_v216/ || true
          fi
          if git diff --cached --quiet; then
            echo "No targeted super-value changes"
          else
            git commit -m "Accelerate contiguous super-value PIT signals"
            git pull --rebase origin main
            git push
          fi

      - name: Upload targeted status and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-value-signal-accelerator
          path: |
            data/status/super_value_signal_backfill_status.csv
            results/super_value_v216/
          if-no-files-found: warn

      - name: Preserve raw sources and checkpoints after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dart-raw-recovery-${{ github.run_id }}
          compression-level: 0
          retention-days: 90
          path: |
            data/financials/dart_raw/
            data/financials/full_history/
            data/financials/legacy_2000_2014/
            data/status/dart*
          if-no-files-found: warn
