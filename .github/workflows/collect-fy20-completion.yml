name: FY20 finite completion evidence (manual, private, no admission)
on:
  pull_request:
    paths:
      - .github/workflows/collect-fy20-completion.yml
      - scripts/fy20_completion_collection.py
      - scripts/fy20_completion_github.py
      - scripts/test_fy20_completion_collection.py
      - scripts/fy20_metadata_github.py
      - config/research/fy20_completion_amendment_20261103.json
  workflow_dispatch:
    inputs:
      collect:
        type: boolean
        default: false
        description: Requires separately approved private continuation plan; false validates only
concurrency:
  group: super-value-fast-pit-backfill
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact checkout and immutable kit, no Internet pip
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Actual validation checkout: $(git rev-parse HEAD)"
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify
      - name: Continuation boundaries and unchanged original collection tests
        run: |
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I -c 'import sys,unittest;sys.path.insert(0,"scripts");r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(["test_fy20_completion_collection","test_fy20_metadata_collection"]));raise SystemExit(not r.wasSuccessful())'
  collect:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.collect && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Same fixed runtime
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Actual source checkout: $GITHUB_SHA"
          python scripts/restore_pinned_financial_kit.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Approved private frozen queue, 600 seconds including persistence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          B_PRIVATE_BACKUP_TOKEN: ${{ secrets.B_PRIVATE_BACKUP_TOKEN || secrets.GH_BACKUP_TOKEN }}
        run: |
          set -o pipefail
          umask 077
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I -c 'import sys,runpy;sys.path.insert(0,"scripts");runpy.run_path("scripts/fy20_completion_github.py",run_name="__main__")' --private-root "$RUNNER_TEMP/fy20-private" --base-grant config/research/fy20_metadata_approval_20261030.json --amendment config/research/fy20_completion_amendment_20261103.json | tee "$RUNNER_TEMP/summary.json"
      - name: Safe counters only, never source or private locations
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/summary.json" ]; then cat "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"; fi
      # No schedule, artifact upload, public raw, release or financial publication.
