name: Backtest Permanent Portfolio ETF Only

on:
  push:
    paths:
      - 'scripts/backtest_permanent_portfolio_etf_only.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy matplotlib

      - name: Run ETF-only permanent portfolio validation
        run: python scripts/backtest_permanent_portfolio_etf_only.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/permanent_portfolio_etf_only/
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update permanent portfolio ETF-only validation"
            git push
          fi
