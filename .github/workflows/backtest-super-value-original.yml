name: Backtest original Kang super value

on:
  push:
    branches:
      - chatgpt-super-value-backtest
    paths:
      - 'scripts/backtest_super_value_original.py'
      - '.github/workflows/backtest-super-value-original.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-super-value-backtest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow
      - name: Run backtest
        run: python scripts/backtest_super_value_original.py
      - name: Commit results to analysis branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/super_value_original/ || true
          if git diff --cached --quiet; then
            echo "No result files to commit"
          else
            git commit -m "Add original super-value backtest results"
            git push origin HEAD:chatgpt-super-value-backtest
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-value-original-results
          path: results/super_value_original/
          if-no-files-found: warn
