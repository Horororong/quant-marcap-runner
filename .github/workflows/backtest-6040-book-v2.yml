name: Backtest Book 60-40 v2

on:
  push:
    paths:
      - 'scripts/backtest_6040_book_v2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run corrected 60/40 backtest
        run: python scripts/backtest_6040_book_v2.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/60_40_book_v2
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add corrected hybrid 60/40 backtest results'
            git push
          fi
