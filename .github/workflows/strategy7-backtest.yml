name: Strategy 7 Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/backtest_strategy7.py"
      - ".github/workflows/strategy7-backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4

      - name: Run Strategy 7 backtest
        run: |
          python scripts/backtest_strategy7.py

      - name: Upload Strategy 7 results
        uses: actions/upload-artifact@v4
        with:
          name: strategy7-results
          path: results/strategy7/
          if-no-files-found: error
          retention-days: 14

      - name: Commit result files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proxy_long/raw/KR_HOUSING_BOND_5Y_YIELD.csv
          git add data/proxy_long/raw/KR_GOVT_BOND_GENERIC_YIELD.csv
          git add results/strategy7/
          if git diff --cached --quiet; then
            echo "No Strategy 7 result changes."
          else
            git commit -m "Update Strategy 7 backtest results"
            git push
          fi
