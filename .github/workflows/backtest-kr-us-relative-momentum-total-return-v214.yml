name: Backtest KR-US Relative Momentum Total Return v2-14

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_kr_us_relative_momentum_total_return_v214.py'
      - '.github/workflows/backtest-kr-us-relative-momentum-total-return-v214.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
      - name: Run total-return rerun
        run: python scripts/backtest_kr_us_relative_momentum_total_return_v214.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/kr_us_relative_momentum_total_return_v214/ data/proxy_long/raw/NASDAQNQKRT.csv
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Run KR-US relative momentum total-return backtest'
            git push
          fi
