name: Financial accuracy fixed-kit revalidation
on:
  push:
    branches: ['fix/financial-accuracy-20261014']
    paths:
      - 'scripts/legacy_native_financials.py'
      - 'scripts/legacy_financial_fields.py'
      - 'scripts/backfill_dart_legacy_2000_2014.py'
      - 'tests/test_financial_accuracy_repair.py'
      - 'tests/test_financial_extraction_stage3.py'
      - 'docs/audits/financial-repair-20261014/**'
      - 'docs/audits/financial-extraction-stage3-20261014/**'
      - 'docs/audits/historical-pit-stage4-20261014/**'
      - 'docs/audits/dart-history-stage5-20261014/**'
      - 'docs/audits/version-pit-stage6-20261014/**'
      - '.github/workflows/financial-accuracy-revalidation.yml'
      - 'scripts/stock_dividend.py'
      - 'scripts/stock_dividend_execution.py'
      - 'scripts/dart_value_factor_adapter.py'
      - 'scripts/test_dart_snapshot_selection.py'
      - 'scripts/collect_stage13_notice.py'
      - 'docs/research/stage13-stock-dividend-integration-20261017/**'
      - 'docs/research/stage14-celltrion-2019-20261017/**'
      - 'docs/research/stage15-research-environment-20261017/**'
      - 'scripts/test_stock_dividend*.py'
      - 'scripts/collect_stock_dividend_metadata.py'
      - 'scripts/read_stock_dividend_artifact.py'
      - 'scripts/collect_stock_dividend_documents.py'
      - 'scripts/collect_stock_dividend_krx.py'
      - 'scripts/test_stock_dividend_krx.py'
      - 'docs/research/stage12-stock-dividend-20261016/**'
permissions:
  contents: read
  actions: read
jobs:
  bounded-stage15-source:
    if: ${{ github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage15-source]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify original pinned offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify
      - name: Remaining three proposals and bounded exchange notices only
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage15-research-environment-20261017/collect_remaining.py --output "$RUNNER_TEMP/stage15-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage15-remaining-primary-sources
          path: ${{ runner.temp }}/stage15-source
          retention-days: 90
  bounded-stage14-source:
    if: ${{ github.run_attempt == 1 && (github.sha == '4612825f5ba6df2d42efe925ddd21dc8d2986a17' && contains(github.event.head_commit.message, '[stage14-source]') || github.sha == '6f88d23ba4a85b6b9babf80404c03fb28e7fc3f8' && contains(github.event.head_commit.message, '[stage14-history]') || github.sha == '2d13fc97fa062ffadca09a920c383d3c98a47df9' && contains(github.event.head_commit.message, '[stage14-listing]') || github.sha == '4c38b66d5eff2e7986762ea11cbf21577444fb10' && contains(github.event.head_commit.message, '[stage14-corrected]') || github.sha == '2fb260dc30c2e188164c69d15b1f45c3a7de8bbe' && contains(github.event.head_commit.message, '[stage14-body]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify original pinned offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify
      - name: New record-date and fraction terms plus issuer archive discovery only
        env:
          STAGE14_LISTING_BODY: "1"
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import runpy,sys;sys.path.insert(0,"docs/research/stage14-celltrion-2019-20261017");runpy.run_path("docs/research/stage14-celltrion-2019-20261017/test_source_formats.py",run_name="__main__")'
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage14-celltrion-2019-20261017/collect_sources.py --listing-access --output "$RUNNER_TEMP/stage14-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage14-primary-source-discovery
          path: ${{ runner.temp }}/stage14-source
          retention-days: 90
  bounded-stage13-notice:
    if: ${{ github.sha == 'a7842f2c9401a421d71aeb13665a8bb6a5393c72' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage13-proof]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify original offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify
      - name: One previously unrequested notice, identity rejection remains UNVERIFIED
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");sys.argv=["scripts/collect_stage13_notice.py","--output","/tmp/stage13-notice"];runpy.run_path(sys.argv[0],run_name="__main__")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage13-official-notice
          path: /tmp/stage13-notice
          retention-days: 90
  bounded-stage12-krx:
    if: ${{ github.sha == '68aed33e8b206a39d45d8168be6254c3e6b72e52' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage12-krx-prices]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify original pinned kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-repair/verify.json"
      - name: At most eight official cash-equity date queries
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");runpy.run_path("scripts/test_stock_dividend_krx.py",run_name="__main__")'
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I scripts/collect_stock_dividend_krx.py --output "$RUNNER_TEMP/stage12-krx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-official-krx-prices
          path: |
            ${{ runner.temp }}/stage12-krx
            ${{ runner.temp }}/financial-repair/verify.json
          retention-days: 90
  bounded-stage12-documents:
    # Completed bounded attempt: do not retry a rejected document from later commits.
    if: ${{ github.sha == '57cdba365bc82aae0be35e5dde9c978e6d7b95cf' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage12-dart-documents]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify same original offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-repair/verify.json"
      - name: Two newly identified ex-dividend notices, no history recollection
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I scripts/collect_stock_dividend_documents.py --output "$RUNNER_TEMP/stage12-documents"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-official-documents
          path: |
            ${{ runner.temp }}/stage12-documents
            ${{ runner.temp }}/financial-repair/verify.json
          retention-days: 90
  stage12-artifact-transfer:
    if: ${{ contains(github.event.head_commit.message, '[stage12-read-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify same original offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify
      - name: Read pinned existing artifact once without another DART request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I scripts/read_stock_dividend_artifact.py
  stock-dividend-regression:
    if: ${{ contains(github.event.head_commit.message, '[stage13]') || contains(github.event.head_commit.message, '[stage14]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original pinned offline kit and verify dedicated Python
        id: runtime
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-repair/verify.json"
      - name: Shared subledger, fail-closed boundaries and existing engine E2E
        env:
          STAGE13_LEDGER_OUTPUT: ${{ runner.temp }}/stage13-independent-ledger.csv
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage13-stock-dividend-integration-20261017/validate.py --output "$RUNNER_TEMP/stage12-validation"
          cmp "$RUNNER_TEMP/stage13-independent-ledger.csv" docs/research/stage13-stock-dividend-integration-20261017/independent_ledger.csv
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage13-stock-dividend-integration-20261017/compare_snapshot.py --output "$RUNNER_TEMP/stage13-snapshot-comparison.json"
      - name: Stage14 original-source and actual-price component assertions (not event PASS)
        if: ${{ contains(github.event.head_commit.message, '[stage14]') }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import runpy,sys;sys.path.insert(0,"docs/research/stage14-celltrion-2019-20261017");runpy.run_path("docs/research/stage14-celltrion-2019-20261017/test_source_formats.py",run_name="__main__")'
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage14-celltrion-2019-20261017/verify_event.py --output "$RUNNER_TEMP/stage14-event-review.json"
          cmp "$RUNNER_TEMP/stage14-event-review.json" docs/research/stage14-celltrion-2019-20261017/event_review.json
      - name: One bounded official exchange-disclosure metadata discovery
        if: ${{ github.sha == 'b7a12ff56e9f4b64b1b26f02b68cb6c2626250bb' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage12-official-proof]') }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I scripts/collect_stock_dividend_metadata.py --output "$RUNNER_TEMP/stage12-official"
      - name: Preserve all prior audit bytes and financial controls without reprocessing
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[stage14]') }}" == "true" ]]; then
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage14-celltrion-2019-20261017/preserve.py --output "$RUNNER_TEMP/stage12-preservation"
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage14-celltrion-2019-20261017/verify_artifacts.py
          else
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage13-stock-dividend-integration-20261017/preserve.py --output "$RUNNER_TEMP/stage12-preservation"
          fi
      - name: Independently reproduce twelve exact official price-field comparisons
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/stage12-stock-dividend-20261016/compare_krx.py --output "$RUNNER_TEMP/stage12-krx-comparison.json"
          cmp "$RUNNER_TEMP/stage12-krx-comparison.json" docs/research/stage12-stock-dividend-20261016/official_krx/comparison.json
      - name: Restore and verify preserved originals and existing replay artifacts only
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/version-pit-stage6-20261014/verify_preserved60.py --output "$RUNNER_TEMP/stage12-originals60"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ contains(github.event.head_commit.message, '[stage14]') && 'stage14-stock-dividend-evidence' || 'stage13-stock-dividend-evidence' }}
          path: |
            ${{ runner.temp }}/stage12-validation
            ${{ runner.temp }}/stage13-independent-ledger.csv
            ${{ runner.temp }}/stage13-snapshot-comparison.json
            ${{ runner.temp }}/stage14-event-review.json
            ${{ runner.temp }}/stage12-official
            ${{ runner.temp }}/stage12-preservation
            ${{ runner.temp }}/stage12-krx-comparison.json
            ${{ runner.temp }}/stage12-originals60/verification.json
            ${{ runner.temp }}/financial-repair/verify.json
          if-no-files-found: error
          retention-days: 90
  fixed-kit:
    if: ${{ !contains(github.event.head_commit.message, '[stage15-source]') && !contains(github.event.head_commit.message, '[stage15]') && !contains(github.event.head_commit.message, '[stage14-body]') && !contains(github.event.head_commit.message, '[stage14-corrected]') && !contains(github.event.head_commit.message, '[stage14-listing]') && !contains(github.event.head_commit.message, '[stage14-history]') && !contains(github.event.head_commit.message, '[stage14-source]') && !contains(github.event.head_commit.message, '[stage14]') && !contains(github.event.head_commit.message, '[stage13-proof]') && !contains(github.event.head_commit.message, '[stage13]') && !contains(github.event.head_commit.message, '[stage12-krx-prices]') && !contains(github.event.head_commit.message, '[stage12-read-artifact]') && !contains(github.event.head_commit.message, '[stage12]') && !contains(github.event.head_commit.message, '[stage6-dart-doc-proof]') && !contains(github.event.head_commit.message, '[stage6-krx-proof]') && !contains(github.event.head_commit.message, '[stage6-evidence]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact original kit and existing sixty receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python docs/audits/financial-repair-20261014/restore_inputs.py --workdir "$RUNNER_TEMP/financial-repair"
          python docs/audits/financial-repair-20261014/restore_holdout.py --output "$RUNNER_TEMP/financial-repair/heldout20"
          python docs/audits/financial-extraction-stage3-20261014/restore_before.py --output "$RUNNER_TEMP/financial-repair/stage2-before"
      - name: Bootstrap original bundled wheels and verify dedicated Python
        run: |
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-repair/verify.json"
      - name: Offline official-history collector safety tests
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/dart-history-stage5-20261014/test_collection.py
      - name: Verify preserved official replies without another API call
        if: ${{ hashFiles('docs/audits/dart-history-stage5-20261014/results/response_manifest.json') != '' }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/dart-history-stage5-20261014/verify_responses.py
      - name: One bounded official DART history proof for existing twenty samples
        id: dart_history
        if: ${{ github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage5-dart-proof]') }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/dart-history-stage5-20261014/collect_history.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --output "$RUNNER_TEMP/financial-repair/stage5"
      - name: Offline bounded document transport and PIT policy tests
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/version-pit-stage6-20261014/test_stage6.py
      - name: Focused safety tests and actual sixty-receipt collector replay
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I tests/test_financial_accuracy_repair.py 2>&1 | tee "$RUNNER_TEMP/financial-repair/unit.log"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I tests/test_financial_extraction_stage3.py 2>&1 | tee "$RUNNER_TEMP/financial-repair/stage3-unit.log"
          for file in test_legacy_document_quality.py test_legacy_viewer_source.py test_legacy_viewer_sections.py test_legacy_schedule_gate.py test_legacy_no_metrics_recovery.py; do
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c "import sys,runpy; sys.path.insert(0,'scripts'); sys.path.insert(0,'.'); runpy.run_path('scripts/$file',run_name='__main__')"
          done
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import sys,runpy; sys.path.insert(0,"scripts"); sys.argv=["scripts/export_strategy_dsl_contract.py","--check"]; runpy.run_path(sys.argv[0],run_name="__main__")'
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-repair-20261014/replay60.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --runtime "$RUNNER_TEMP/financial-repair/runtime" --output "$RUNNER_TEMP/financial-repair/replay60"
      - name: Independent original XML DOM comparison and required regressions
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-extraction-stage3-20261014/revalidate.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --replay "$RUNNER_TEMP/financial-repair/replay60" --output "$RUNNER_TEMP/financial-repair/results"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-extraction-stage3-20261014/forensic_compare.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --before-replay "$RUNNER_TEMP/financial-repair/stage2-before/replay60" --before-audit "$RUNNER_TEMP/financial-repair/stage2-before/results" --after-replay "$RUNNER_TEMP/financial-repair/replay60" --after-audit "$RUNNER_TEMP/financial-repair/results" --output "$RUNNER_TEMP/financial-repair/results"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-repair-20261014/assert_regressions.py --replay "$RUNNER_TEMP/financial-repair/replay60" --output "$RUNNER_TEMP/financial-repair/results/original_regressions.json"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-extraction-stage3-20261014/assert_stage3.py --replay "$RUNNER_TEMP/financial-repair/replay60" --results "$RUNNER_TEMP/financial-repair/results"
      - name: Verify deterministic result identity; does not certify accuracy
        run: |
