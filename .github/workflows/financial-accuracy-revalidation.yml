name: Financial accuracy fixed-kit revalidation
on:
  push:
    branches: ['fix/financial-accuracy-20261014']
    paths:
      - 'scripts/financial_record_readiness.py'
      - 'scripts/financial_publication_evidence.py'
      - 'scripts/financial_source_grid.py'
      - 'scripts/research_incident_groups.py'
      - 'scripts/test_research_incident_groups.py'
      - 'tests/test_financial_record_readiness.py'
      - 'docs/research/source-readiness-20261019/**'
      - 'scripts/legacy_native_financials.py'
      - 'scripts/legacy_parser_migration.py'
      - 'scripts/dart_service_status.py'
      - 'scripts/fast_backfill_phase_policy.py'
      - 'scripts/backfill_super_value_fast.py'
      - 'tests/test_financial_backfill_v8.py'
      - 'scripts/legacy_financial_fields.py'
      - 'scripts/backfill_dart_legacy_2000_2014.py'
      - 'tests/test_financial_accuracy_repair.py'
      - 'tests/test_financial_extraction_stage3.py'
      - 'docs/audits/financial-repair-20261014/**'
      - 'docs/audits/backfill-accuracy-20261018/**'
      - 'docs/audits/financial-extraction-stage3-20261014/**'
      - 'docs/audits/historical-pit-stage4-20261014/**'
      - 'docs/audits/dart-history-stage5-20261014/**'
      - 'docs/audits/version-pit-stage6-20261014/**'
      - '.github/workflows/financial-accuracy-revalidation.yml'
      - 'scripts/stock_dividend.py'
      - 'scripts/stock_dividend_execution.py'
      - 'scripts/stock_dividend_research.py'
      - 'scripts/research_workbench.py'
      - 'scripts/research_readiness.py'
      - 'scripts/test_research_workbench.py'
      - 'scripts/verify_research_dashboard.cjs'
      - 'scripts/strategy_dsl*.py'
      - 'scripts/corporate_action_preflight.py'
      - 'scripts/quant_backtest_postprocess.py'
      - 'scripts/export_strategy_dsl_contract.py'
      - 'config/research/**'
      - 'config/strategies/**'
      - 'config/reports/**'
      - 'config/strategy_dsl*.json'
      - 'scripts/dart_value_factor_adapter.py'
      - 'scripts/test_dart_snapshot_selection.py'
      - 'scripts/collect_stage13_notice.py'
      - 'docs/research/stage13-stock-dividend-integration-20261017/**'
      - 'docs/research/stage14-celltrion-2019-20261017/**'
      - 'docs/research/stage15-research-environment-20261017/**'
      - 'docs/research/stage16-continuous-research-20261018/**'
      - 'docs/research/long-execution-20261018/**'
      - 'docs/research/multi-asset-20261018/**'
      - 'docs/research/long-multi-backfill-20261018/**'
      - 'scripts/test_stock_dividend*.py'
      - 'scripts/collect_stock_dividend_metadata.py'
      - 'scripts/read_stock_dividend_artifact.py'
      - 'scripts/collect_stock_dividend_documents.py'
      - 'scripts/collect_stock_dividend_krx.py'
      - 'scripts/test_stock_dividend_krx.py'
      - 'docs/research/stage12-stock-dividend-20261016/**'
permissions:
  contents: read
  actions: read
jobs:
  financial-signal-official-market-proof:
    if: github.run_attempt == 1 && ((github.sha == 'd438c6c6acbab2ede4679fef650f439d51b968f6' && contains(github.event.head_commit.message, '[financial-signal-market-proof]')) || (github.sha == '762ba9ed2dd05a9f08a342e525c33802dec8e127' && contains(github.event.head_commit.message, '[financial-signal-body-proof]')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact fixed kit; no pip
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: Only four cash-market 2010 responses; no operating writes
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[financial-signal-body-proof]') }}" == "true" ]]; then
            "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/collect_financial_signal_market.py --dart-section --output "$RUNNER_TEMP/market-proof"
          else
            "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I scripts/collect_financial_signal_market.py --output "$RUNNER_TEMP/market-proof"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-signal-official-market-proof
          path: |
            ${{ runner.temp }}/market-proof
            ${{ runner.temp }}/runtime.json
          if-no-files-found: error
          retention-days: 90
  source-readiness-and-incident-regression:
    if: contains(github.event.head_commit.message, '[source-readiness]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact pinned kit and verify
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/fixed"
          python "$RUNNER_TEMP/fixed/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/fixed/kit-parts" --destination "$RUNNER_TEMP/fixed/runtime"
          "$RUNNER_TEMP/fixed/runtime/.venv/bin/python" -I "$RUNNER_TEMP/fixed/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/runtime.json"
      - name: As-of boundaries, common factor owner, existing DART E2E and readiness regressions
        run: |
          PY="$RUNNER_TEMP/fixed/runtime/.venv/bin/python"
          "$PY" -I -m unittest discover -s tests -p test_financial_record_readiness.py -v
          "$PY" -I -m unittest discover -s scripts -p test_research_incident_groups.py -v
          "$PY" -I -m unittest discover -s scripts -p test_dart_snapshot_selection.py -v
          "$PY" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");runpy.run_path("scripts/test_research_planned_readiness.py",run_name="__main__")'
          timeout 150 "$PY" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");runpy.run_path("scripts/test_dart_dsl_super_value.py",run_name="__main__")'
          "$PY" -I -c 'import runpy,sys;sys.path.insert(0,"scripts");sys.argv=["scripts/export_strategy_dsl_contract.py","--check"];runpy.run_path(sys.argv[0],run_name="__main__")'
          "$PY" -I docs/research/source-readiness-20261019/reproduce.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-readiness-and-common-factor
          path: |
            ${{ runner.temp }}/runtime.json
            docs/research/source-readiness-20261019/actual_signal_result.json
            docs/research/source-readiness-20261019/incident_groups.json.gz.b64
          if-no-files-found: error
          retention-days: 90
  financial-backfill-existing-sources:
    if: ${{ github.run_attempt == 1 && (((github.sha == '14804b081585bbb5769c76ff6182cc69135eb6a1' || github.sha == '9b6634c5f2326127c6fb6ad6d76a809edf12558c') && contains(github.event.head_commit.message, '[financial-backfill-source]')) || (github.sha == '98ee6462c6da3d33e43529a00bc95b988a4dbfed' && contains(github.event.head_commit.message, '[financial-reserve-source]'))) }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact offline kit and verify before evidence access
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-runtime.json"
      - name: Freeze holdout and transfer only selected EXISTING originals; zero DART calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[financial-reserve-source]') }}" == "true" ]]; then
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/backfill-accuracy-20261018/prepare_reserve.py --output "$RUNNER_TEMP/financial-selected-originals"
          else
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/backfill-accuracy-20261018/prepare_sources.py --output "$RUNNER_TEMP/financial-selected-originals"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-backfill-selected-originals
          path: |
            ${{ runner.temp }}/financial-selected-originals/selected_originals.json.gz.b64
            ${{ runner.temp }}/financial-selected-originals/reserve_originals.json.gz.b64
            ${{ runner.temp }}/financial-selected-originals/selected_receipts.json
            ${{ runner.temp }}/financial-selected-originals/transfer.json
            ${{ runner.temp }}/financial-runtime.json
          if-no-files-found: error
          retention-days: 90
  financial-backfill-repair:
    if: ${{ contains(github.event.head_commit.message, '[financial-backfill]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify original fixed kit only
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-runtime.json"
      - name: Verify pinned prior sixty originals and replay artifact; no source collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/version-pit-stage6-20261014/verify_preserved60.py --output "$RUNNER_TEMP/preserved60"
      - name: Actual extraction, independent original controls, 518 and64 and bounded transient recovery
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/backfill-accuracy-20261018/validate.py --check --originals "$RUNNER_TEMP/preserved60/originals60.zip" --runtime "$RUNNER_TEMP/financial-repair/runtime" --output "$RUNNER_TEMP/financial-repair-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-backfill-independent-repair
          path: |
            ${{ runner.temp }}/financial-repair-validation
            ${{ runner.temp }}/preserved60/verification.json
            ${{ runner.temp }}/financial-runtime.json
          if-no-files-found: error
          retention-days: 90
  long-backfill-continuation:
    if: ${{ contains(github.event.head_commit.message, '[long-backfill]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original pinned offline kit, no new dependency installation
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/continuation-runtime.json"
      - name: Service maintenance, budget phases, pinned sources, financial source controls and actual2026JSON/Korean/independent book
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/validate_continuation.py --check --output "$RUNNER_TEMP/long-backfill-continuation"
      - name: Actual2026CURRENT chart period/cost interactions without installations
        run: |
          node scripts/verify_research_dashboard.cjs "$RUNNER_TEMP/long-backfill-continuation/json/report/report_CURRENT.html" "$RUNNER_TEMP/continuation-browser"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-backfill-continuation
          path: |
            ${{ runner.temp }}/long-backfill-continuation
            ${{ runner.temp }}/continuation-browser
            ${{ runner.temp }}/continuation-runtime.json
          if-no-files-found: error
          retention-days: 90
  continuation-rights-census:
    if: ${{ github.run_attempt == 1 && github.sha == '22bbe36de14b28b404658df3725171b40f39e904' && contains(github.event.head_commit.message, '[continuation-rights]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore same pinned offline kit
        id: runtime
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/rights-runtime.json"
      - name: Only original small subset for service-error census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/restore_existing_evidence.py --subset --output "$RUNNER_TEMP/maintenance-existing"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/inspect_maintenance.py --evidence "$RUNNER_TEMP/maintenance-existing/evidence" --output "$RUNNER_TEMP/maintenance-census"
      - name: One declared rights-market service; at most five distinct market-days; first failure stops
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/collect_official.py --mode rights --output "$RUNNER_TEMP/bio-rights-quotes"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-rights-and-maintenance
          path: |
            ${{ runner.temp }}/maintenance-existing/restore.json
            ${{ runner.temp }}/maintenance-census
            ${{ runner.temp }}/bio-rights-quotes
          if-no-files-found: error
          retention-days: 90
  continuation-source:
    if: ${{ github.run_attempt == 1 && ((github.sha == '241fbb1a6faeba197d570228f00ab2784b600da0' && contains(github.event.head_commit.message, '[continuation-source]')) || (github.sha == '465d10726239552240b1cb814aefd1a2dd96ad18' && contains(github.event.head_commit.message, '[continuation-recovery]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified original offline kit
        id: runtime
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/continuation-runtime.json"
      - uses: actions/checkout@v4
        with:
          ref: 78ab49df4b25e0b71df0fc4366fcc7f5d0a179a9
          path: _main_snapshot
      - name: Restore existing artifact through one bounded official API read per distinct artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/restore_existing_evidence.py --output "$RUNNER_TEMP/restored-existing"
      - name: Pinned main state and predeclared independent source export; no collector execution
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/read_main_evidence.py --snapshot _main_snapshot --evidence "$RUNNER_TEMP/restored-existing/evidence" --output "$RUNNER_TEMP/main-evidence-review"
      - name: Only new Bio rights sources
        if: ${{ always() && steps.runtime.outcome == 'success' && !contains(github.event.head_commit.message, '[continuation-recovery]') }}
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/collect_official.py --mode bio --output "$RUNNER_TEMP/bio-official"
      - name: Only missing2026 index and five recent equity sessions
        if: ${{ always() && steps.runtime.outcome == 'success' }}
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/long-multi-backfill-20261018/collect_official.py --mode 2026 --output "$RUNNER_TEMP/extension2026-official"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-primary-evidence
          path: |
            ${{ runner.temp }}/restored-existing/restore.json
            ${{ runner.temp }}/main-evidence-review
            ${{ runner.temp }}/bio-official
            ${{ runner.temp }}/extension2026-official
            ${{ runner.temp }}/continuation-runtime.json
          if-no-files-found: error
          retention-days: 90
  bounded-multi-asset-quotes:
    if: ${{ github.run_attempt == 1 && github.sha == '50fbaf55675acbe06a7ccf3f55c8370deda18d00' && contains(github.event.head_commit.message, '[multi-asset-quotes]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original pinned offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify
      - name: New LG LX market-day and separate 2026 evidence only
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/multi-asset-20261018/collect_quote_calendar.py --output "$RUNNER_TEMP/multi-asset-quotes"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-asset-quotes-primary
          path: ${{ runner.temp }}/multi-asset-quotes
          retention-days: 90
  bounded-multi-asset-source:
    if: ${{ github.run_attempt == 1 && ((github.sha == 'dfa9a9e07df9f89d94667e3fab9b930608f24f8d' && contains(github.event.head_commit.message, '[multi-asset-source]')) || (github.sha == '002ed7b9dac22457836a2b760a1336f2bed3beb6' && contains(github.event.head_commit.message, '[multi-asset-followup]')) || (github.sha == 'ba5830d157968b516ebf45edc29ab5f5da560c84' && contains(github.event.head_commit.message, '[multi-asset-historical]')) || (github.sha == 'f4626e1aee9978a0d6037cab75802dcfd5795495' && contains(github.event.head_commit.message, '[multi-asset-skt]')) || (github.sha == 'e6ac03007adc665e2b14a9b9ace812c50b8d5e15' && contains(github.event.head_commit.message, '[multi-asset-skt-terms]')) || (github.sha == '039d36b3d75757ead312ecb1a94d60ea229f4107' && contains(github.event.head_commit.message, '[multi-asset-div2021]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original pinned offline kit
        run: |
          python docs/audits/version-pit-stage6-20261014/restore_kit_only.py --output "$RUNNER_TEMP/financial-repair"
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify
      - name: Bounded public demerger notices and optional one new official market-day
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[multi-asset-div2021]') }}" == "true" ]]; then
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/multi-asset-20261018/collect_div2021.py --output "$RUNNER_TEMP/multi-asset-source"
          elif [[ "${{ contains(github.event.head_commit.message, '[multi-asset-skt-terms]') }}" == "true" ]]; then
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/multi-asset-20261018/collect_lg_lx.py --skt-terms --output "$RUNNER_TEMP/multi-asset-source"
          elif [[ "${{ contains(github.event.head_commit.message, '[multi-asset-skt]') }}" == "true" ]]; then
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/multi-asset-20261018/collect_lg_lx.py --skt --output "$RUNNER_TEMP/multi-asset-source"
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/research/multi-asset-20261018/collect_quote_calendar.py --stock-only --stock-date 20211129 --stock-codes 017670,402340 --output "$RUNNER_TEMP/multi-asset-source-quotes"
