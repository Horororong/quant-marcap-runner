name: Financial accuracy fixed-kit revalidation
on:
  push:
    branches: ['fix/financial-accuracy-20261014']
    paths:
      - 'scripts/legacy_native_financials.py'
      - 'scripts/legacy_financial_fields.py'
      - 'scripts/backfill_dart_legacy_2000_2014.py'
      - 'tests/test_financial_accuracy_repair.py'
      - 'tests/test_financial_extraction_stage3.py'
      - 'docs/audits/financial-repair-20261014/**'
      - 'docs/audits/financial-extraction-stage3-20261014/**'
      - 'docs/audits/historical-pit-stage4-20261014/**'
      - 'docs/audits/dart-history-stage5-20261014/**'
      - '.github/workflows/financial-accuracy-revalidation.yml'
permissions:
  contents: read
  actions: read
jobs:
  fixed-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact original kit and existing sixty receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python docs/audits/financial-repair-20261014/restore_inputs.py --workdir "$RUNNER_TEMP/financial-repair"
          python docs/audits/financial-repair-20261014/restore_holdout.py --output "$RUNNER_TEMP/financial-repair/heldout20"
          python docs/audits/financial-extraction-stage3-20261014/restore_before.py --output "$RUNNER_TEMP/financial-repair/stage2-before"
      - name: Bootstrap original bundled wheels and verify dedicated Python
        run: |
          python "$RUNNER_TEMP/financial-repair/kit-parts/bootstrap_quant.py" --parts-dir "$RUNNER_TEMP/financial-repair/kit-parts" --destination "$RUNNER_TEMP/financial-repair/runtime"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I "$RUNNER_TEMP/financial-repair/runtime/scripts/sandbox_runtime.py" verify > "$RUNNER_TEMP/financial-repair/verify.json"
      - name: Offline official-history collector safety tests
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/dart-history-stage5-20261014/test_collection.py
      - name: Verify preserved official replies without another API call
        if: ${{ hashFiles('docs/audits/dart-history-stage5-20261014/results/response_manifest.json') != '' }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/dart-history-stage5-20261014/verify_responses.py
      - name: One bounded official DART history proof for existing twenty samples
        id: dart_history
        if: ${{ github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[stage5-dart-proof]') }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/dart-history-stage5-20261014/collect_history.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --output "$RUNNER_TEMP/financial-repair/stage5"
      - name: Focused safety tests and actual sixty-receipt collector replay
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I tests/test_financial_accuracy_repair.py 2>&1 | tee "$RUNNER_TEMP/financial-repair/unit.log"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I tests/test_financial_extraction_stage3.py 2>&1 | tee "$RUNNER_TEMP/financial-repair/stage3-unit.log"
          for file in test_legacy_document_quality.py test_legacy_viewer_source.py test_legacy_viewer_sections.py test_legacy_schedule_gate.py test_legacy_no_metrics_recovery.py; do
            "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c "import sys,runpy; sys.path.insert(0,'scripts'); sys.path.insert(0,'.'); runpy.run_path('scripts/$file',run_name='__main__')"
          done
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import sys,runpy; sys.path.insert(0,"scripts"); sys.argv=["scripts/export_strategy_dsl_contract.py","--check"]; runpy.run_path(sys.argv[0],run_name="__main__")'
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-repair-20261014/replay60.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --runtime "$RUNNER_TEMP/financial-repair/runtime" --output "$RUNNER_TEMP/financial-repair/replay60"
      - name: Independent original XML DOM comparison and required regressions
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-extraction-stage3-20261014/revalidate.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --replay "$RUNNER_TEMP/financial-repair/replay60" --output "$RUNNER_TEMP/financial-repair/results"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-extraction-stage3-20261014/forensic_compare.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --before-replay "$RUNNER_TEMP/financial-repair/stage2-before/replay60" --before-audit "$RUNNER_TEMP/financial-repair/stage2-before/results" --after-replay "$RUNNER_TEMP/financial-repair/replay60" --after-audit "$RUNNER_TEMP/financial-repair/results" --output "$RUNNER_TEMP/financial-repair/results"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-repair-20261014/assert_regressions.py --replay "$RUNNER_TEMP/financial-repair/replay60" --output "$RUNNER_TEMP/financial-repair/results/original_regressions.json"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/financial-extraction-stage3-20261014/assert_stage3.py --replay "$RUNNER_TEMP/financial-repair/replay60" --results "$RUNNER_TEMP/financial-repair/results"
      - name: Verify deterministic result identity; does not certify accuracy
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import hashlib,os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"])/"financial-repair/results"; expected=pathlib.Path("docs/audits/financial-extraction-stage3-20261014/results"); names=["audit_details.csv","validation_summary.json","original_regressions.json","stage3_assertions.json","forensic_summary.json","unverified135_classification.csv","protected518.csv","before_after565.csv"]; [(print(n,hashlib.sha256((root/n).read_bytes()).hexdigest()), (_ for _ in ()).throw(AssertionError(n)) if (root/n).read_bytes()!=(expected/n).read_bytes() else None) for n in names]'
      - name: Independent historical identity and PIT evidence audit
        run: |
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/historical-pit-stage4-20261014/test_stage4_audit.py
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I docs/audits/historical-pit-stage4-20261014/run_stage4.py --original40 "$RUNNER_TEMP/financial-repair/review" --holdout20 "$RUNNER_TEMP/financial-repair/heldout20/review" --replay "$RUNNER_TEMP/financial-repair/replay60" --output "$RUNNER_TEMP/financial-repair/stage4"
          "$RUNNER_TEMP/financial-repair/runtime/.venv/bin/python" -I -c 'import os,pathlib,hashlib; actual=pathlib.Path(os.environ["RUNNER_TEMP"])/"financial-repair/stage4"; expected=pathlib.Path("docs/audits/historical-pit-stage4-20261014/results"); names=["stage4_details.csv","signal_tests.csv","summary.json","source_facts.json"]; [(print(name,hashlib.sha256((actual/name).read_bytes()).hexdigest()), (_ for _ in ()).throw(AssertionError(name)) if (actual/name).read_bytes()!=(expected/name).read_bytes() else None) for name in names]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-accuracy-revalidation60
          path: |
            ${{ runner.temp }}/financial-repair/results
            ${{ runner.temp }}/financial-repair/replay60
            ${{ runner.temp }}/financial-repair/unit.log
            ${{ runner.temp }}/financial-repair/stage3-unit.log
            ${{ runner.temp }}/financial-repair/verify.json
            ${{ runner.temp }}/financial-repair/stage4
          retention-days: 30
      - name: Preserve bounded official DART history responses and safe diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.dart_history.outcome != 'skipped' }}
        with:
          name: dart-official-history20
          path: ${{ runner.temp }}/financial-repair/stage5
          if-no-files-found: error
          retention-days: 90
      - name: Preserve the sixty exact original ZIPs and selection manifests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-accuracy-preserved-originals60
          path: |
            ${{ runner.temp }}/financial-repair/review
            ${{ runner.temp }}/financial-repair/heldout20/review
          retention-days: 90
