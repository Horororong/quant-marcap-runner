name: Backtest Cash SP500 50-50

on:
  push:
    paths:
      - 'scripts/backtest_cash_sp500_5050.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib requests
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          fc-cache -fv >/dev/null

      - name: Run backtest
        run: python scripts/backtest_cash_sp500_5050.py

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/cash_sp500_5050
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add cash SP500 50-50 backtest results'
            git push
          fi
